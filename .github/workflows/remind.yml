name: Daily goal reminders

on:
  schedule:
    - cron: "5 8-20/2 * * *" # every 2 hours, 09:05 to 21:05 in Tunis
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message without sending it"
        type: boolean
        default: false

concurrency:
  group: remind
  cancel-in-progress: true

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pywebpush==2.0.3
      - name: Send today's goal reminder
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PYTHONUNBUFFERED: "1"
        run: python collector/remind.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
