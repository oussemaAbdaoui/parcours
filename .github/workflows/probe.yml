name: Probe pages (stealth)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: scrapling install
      - run: python collector/probe.py $URLS
        env:
          URLS: ${{ inputs.urls }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out/
          retention-days: 3
