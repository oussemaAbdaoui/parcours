name: Export Poli datasets

# Manual only: saves the full Poli data (raw JSON and CSV) as a downloadable run artifact, before the Pro account ends.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Export
        env:
          POLI_EMAIL: ${{ secrets.POLI_EMAIL }}
          POLI_PASSWORD: ${{ secrets.POLI_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: python collector/poli.py --export=poli-export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poli-export
          path: poli-export
          retention-days: 90
