name: Try script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in collector/ to run"
        required: true
        default: "try_jobspy.py"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: scrapling install
      - run: python "collector/${{ inputs.script }}"
