name: Refresh companies

on:
  schedule:
    - cron: "40 4,16 * * *" # twice a day, 05:40 and 17:40 in Tunis
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print results without saving"
        type: boolean
        default: false

concurrency:
  group: collect # never runs at the same time as the offer collector
  cancel-in-progress: false

jobs:
  companies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: scrapling install # browser for the Indeed rating lookups
      - name: Refresh ratings, queue interview stories, save the summary
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python collector/companies.py ${{ inputs.dry_run && '--dry-run' || '' }}
