<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<script defer src="/_vercel/speed-insights/script.js"></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Visual language after Notion's workspace (awesome-design-md/notion): warm neutrals, flat pages,
   pastel property tags, one blue accent. Shape rule: controls 6px, cards and panels 10px, tags 4px. */
@font-face{font-family:"Twemoji Country Flags";unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E0063,U+E0065,U+E0067,U+E006C,U+E006E,U+E0073-E0074,U+E0077,U+E007F;src:url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/dist/TwemojiCountryFlags.woff2") format("woff2");font-display:swap}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f7f5; --soft:#efefed; --side:#f7f7f5; --side-h:#ebebea;
  --ink:#37352f; --ink-strong:#1f1e1b; --muted:#787774; --faint:#a5a4a0;
  --line:#e9e9e7; --line-2:#f1f1ef; --line-strong:#dcdcd9; --ring:#2383e2;
  --blue:#2383e2; --blue-h:#0b6ec5; --blue-t:#e7f3f8; --blue-ink:#1f5f8b;
  --job:#448361; --master:#337ea9; --phd:#9065b0;
  --job-t:#edf3ec; --master-t:#e7f3f8; --phd-t:#f6f3f9;
  --ok:#448361; --warn:#cb912f; --bad:#d44c47;
  --hi:#1c3829; --hi-t:#dbeddb; --mid:#402c1b; --mid-t:#fdecc8; --lo:#5d1715; --lo-t:#ffe2dd;
  --tag:#e3e2e0; --tag-ink:#32302c;
  --c-yours:#2a78d6; --c-gap:#eb6834; --b-strong:#104281; --b-fair:#2a78d6; --b-weak:#86b6ef;
  --accent:var(--job); --tint:var(--job-t);
  --display:'Inter','Twemoji Country Flags',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter','Twemoji Country Flags',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,monospace;
  --r:6px; --rc:10px;
  --shadow:none;
  --lift:0 0 0 1px rgba(15,15,15,.07),0 2px 4px rgba(15,15,15,.05);
  --lift-h:0 0 0 1px rgba(15,15,15,.09),0 6px 14px rgba(15,15,15,.08);
  --pop:0 0 0 1px rgba(15,15,15,.06),0 12px 32px -6px rgba(15,15,15,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#191919; --surface:#191919; --surface-2:#202020; --soft:#2a2a2a; --side:#202020; --side-h:#2c2c2c;
  --ink:#d9d9d8; --ink-strong:#f0efed; --muted:#9b9a97; --faint:#6f6e6b;
  --line:#2f2f2f; --line-2:#262626; --line-strong:#3a3a3a; --ring:#2e8fe8;
  --blue:#2e8fe8; --blue-h:#4aa0ee; --blue-t:#1d2a35; --blue-ink:#7fbaf0;
  --job:#5fa57e; --master:#4a9fd4; --phd:#a67ed4; --job-t:#1f2a24; --master-t:#1c2830; --phd-t:#29222f;
  --ok:#5fa57e; --warn:#d0a045; --bad:#e0625d;
  --hi:#e6f2e9; --hi-t:#2b593f; --mid:#f7ecd6; --mid-t:#6b4f22; --lo:#fbe4e1; --lo-t:#6e3630;
  --tag:#373737; --tag-ink:#e6e6e5;
  --c-yours:#3987e5; --c-gap:#d95926; --b-strong:#86b6ef; --b-fair:#3987e5; --b-weak:#184f95;
  --lift:0 0 0 1px rgba(255,255,255,.07); --lift-h:0 0 0 1px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.35);
  --pop:0 0 0 1px rgba(255,255,255,.08),0 16px 40px -8px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#191919; --surface:#191919; --surface-2:#202020; --soft:#2a2a2a; --side:#202020; --side-h:#2c2c2c;
  --ink:#d9d9d8; --ink-strong:#f0efed; --muted:#9b9a97; --faint:#6f6e6b;
  --line:#2f2f2f; --line-2:#262626; --line-strong:#3a3a3a; --ring:#2e8fe8;
  --blue:#2e8fe8; --blue-h:#4aa0ee; --blue-t:#1d2a35; --blue-ink:#7fbaf0;
  --job:#5fa57e; --master:#4a9fd4; --phd:#a67ed4; --job-t:#1f2a24; --master-t:#1c2830; --phd-t:#29222f;
  --ok:#5fa57e; --warn:#d0a045; --bad:#e0625d;
  --hi:#e6f2e9; --hi-t:#2b593f; --mid:#f7ecd6; --mid-t:#6b4f22; --lo:#fbe4e1; --lo-t:#6e3630;
  --tag:#373737; --tag-ink:#e6e6e5;
  --c-yours:#3987e5; --c-gap:#d95926; --b-strong:#86b6ef; --b-fair:#3987e5; --b-weak:#184f95;
  --lift:0 0 0 1px rgba(255,255,255,.07); --lift-h:0 0 0 1px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.35);
  --pop:0 0 0 1px rgba(255,255,255,.08),0 16px 40px -8px rgba(0,0,0,.6);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(56px + env(safe-area-inset-top,0px));-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button,a,summary,select,label{touch-action:manipulation}
button{cursor:pointer}
a{color:inherit}
::selection{background:color-mix(in srgb,var(--blue) 24%,transparent)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
svg.ic{width:18px;height:18px;flex:none}
.skip{position:absolute;left:12px;top:-60px;z-index:60;background:var(--ink-strong);color:var(--bg);padding:8px 14px;border-radius:var(--r);text-decoration:none;font-weight:500}
.skip:focus{top:12px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
#view>*:nth-child(2){animation-delay:.03s}#view>*:nth-child(3){animation-delay:.06s}#view>*:nth-child(4){animation-delay:.09s}#view>*:nth-child(n+5){animation-delay:.12s}

/* ---------- frame: sidebar + top bar ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:10px 8px;background:var(--side);box-shadow:inset -1px 0 0 var(--line-2);overflow-y:auto;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--ink-strong);padding:6px 8px;border-radius:var(--r);margin-bottom:10px}
.brand:hover{background:var(--side-h)}
.brand .logo-mark{flex:none;color:var(--ink-strong)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.25}
.navlab{font-size:12px;font-weight:500;color:var(--muted);padding:14px 10px 4px}
.tabs{display:flex;flex-direction:column;gap:1px}
.tabs a{display:flex;align-items:center;gap:10px;text-decoration:none;height:32px;padding:0 10px;border-radius:var(--r);color:#5f5e5b;font-size:14px;font-weight:500;transition:background-color .12s,color .12s}
.tabs a svg{color:var(--faint);transition:color .12s}
.tabs a:hover{background:var(--side-h);color:var(--ink-strong)}
.tabs a[aria-current="page"]{background:var(--side-h);color:var(--ink-strong)}
.tabs a[aria-current="page"] svg{color:var(--ink-strong)}
:root[data-theme="dark"] .tabs a{color:#a3a29e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs a{color:#a3a29e}}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
.syncl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.syncl:not(:empty)::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.syncl.on::before{background:var(--ok)}.syncl.err::before{background:var(--bad)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;height:48px;padding-inline:20px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}
.topbar .where{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);min-width:0}
.topbar .where b{color:var(--ink-strong);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;background:transparent;border-radius:var(--r);color:var(--muted);transition:background-color .12s,color .12s}
.iconbtn:hover{background:var(--soft);color:var(--ink-strong)}
.theme{display:none}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-inline:48px;padding-block:28px 72px}

/* ---------- type ---------- */
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-.022em;color:var(--ink-strong);margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.012em;color:var(--ink-strong);margin:0 0 2px;text-wrap:balance}
h3{text-wrap:balance;color:var(--ink-strong)}
p{text-wrap:pretty}
.sub{color:var(--muted);margin:0 0 28px;max-width:68ch;font-size:15px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:72ch}
.lab{font-size:13px;font-weight:500;display:block;margin-bottom:6px;color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:14px}
.crumbs a{text-decoration:none;color:var(--muted);border-radius:4px;padding:1px 4px;margin:-1px -4px}
.crumbs a:hover{color:var(--ink-strong);background:var(--soft)}
.crumbs b{color:var(--ink-strong);font-weight:500}
.crumbs span{color:var(--faint)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);font-size:14px;font-weight:500;line-height:1;color:var(--ink-strong);text-decoration:none;white-space:nowrap;transition:background-color .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--soft)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--blue);color:#fff;border-color:transparent}
.btn.primary:hover{background:var(--blue-h)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink-strong)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=date],input[type=url],input[type=number],input[type=password],input[type=search],input[type=email],textarea{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-strong);border-radius:var(--r);padding:0 10px;height:34px;font-size:14px;width:100%;transition:border-color .12s,box-shadow .12s}
textarea{padding:8px 10px;height:auto;line-height:1.55;resize:vertical}
select{padding-right:28px}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--line-strong) 60%,var(--muted))}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.toolbar select{width:auto;height:30px;font-size:13px}
.toolbar input[type=search]{height:30px;max-width:300px;flex:1 1 220px;font-size:13.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;align-items:center}
.filters select{width:auto;height:30px;font-size:13px}
.sc{display:inline-flex;gap:6px;align-items:center;height:30px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 10px;font-size:13px;background:var(--surface);cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
.sc:hover{background:var(--soft)}
.sc:has(input:checked){border-color:color-mix(in srgb,var(--blue) 40%,transparent);background:var(--blue-t);color:var(--blue-ink)}
.sc.off{opacity:.45;cursor:not-allowed}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px}

/* ---------- surfaces: pages are flat, sections separated by space ---------- */
.panel{background:none;border:0;border-radius:0;padding:0;margin-bottom:44px}
.panel>h2{margin-bottom:4px}
.panel>h2+.hint{margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:44px}
.two .panel{margin-bottom:0}
@media(max-width:760px){.two{grid-template-columns:1fr;gap:36px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.demo{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface-2);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;font-size:13.5px}
.demo.warn{background:var(--mid-t);color:var(--mid)}
.nudge{background:var(--surface-2);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.nudge a{font-weight:500}
.empty{text-align:left;padding:28px 28px 30px;background:var(--surface-2);border-radius:var(--rc)}
.empty h2{font-size:17px}
.empty p{color:var(--muted);max-width:56ch;margin:6px 0 18px}
.empty .row{justify-content:flex-start}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin-bottom:44px}
.stat{display:flex;flex-direction:column;padding:2px 20px 2px 18px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border-left:0}
.stat span{order:0;font-size:13px;font-weight:500;color:var(--muted)}
.stat b{order:1;font-size:30px;font-weight:600;letter-spacing:-.025em;color:var(--ink-strong);margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{order:2;font-size:12.5px;color:var(--faint)}

/* ---------- charts ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{overflow-x:auto}
.chart svg{display:block;min-width:600px;width:100%;height:auto}
svg .t{fill:var(--muted);font-size:12px;font-family:var(--body)}
svg .tb{fill:var(--ink-strong);font-size:12.5px;font-weight:500;font-family:var(--body)}
svg .grid{stroke:var(--line-2);stroke-width:1}
svg .today{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
svg .dot{cursor:pointer}
svg .dot:hover{stroke:var(--ink-strong);stroke-width:2}
.frow{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.frow .tr{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;position:relative}
.frow .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.frow .tr i.b{background:var(--blue)}
.frow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.frow .v b{color:var(--ink-strong);font-weight:500}
.frow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{display:grid;grid-template-columns:130px repeat(3,1fr);gap:0;min-width:520px}
.mxw{overflow-x:auto}
.mx>*{padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:1px solid var(--line-2)}
.mx .h{border-top:0;font-size:12px;font-weight:500;color:var(--muted)}
.mx .cn{align-items:flex-start;flex-direction:row;gap:8px;font-weight:500;font-size:14px;justify-content:flex-start}
.mx a{text-decoration:none;border-radius:var(--r)}
.mx a:hover{background:var(--soft)}
.mx .c{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;font-size:12px}
.mx .z{color:var(--line-strong);font-size:20px;line-height:1}
.mx small{font-size:11px;color:var(--muted)}
.insight{white-space:pre-wrap;font-size:14px;margin-top:12px;max-width:70ch}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:44px}
.charts .panel{margin:0;padding:18px 20px;border-radius:var(--rc);box-shadow:var(--lift)}
.charts .chart-skills{grid-row:span 2}
@media(max-width:900px){.charts{grid-template-columns:1fr}.charts .chart-skills{grid-row:auto}}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.yours,.hbars b.yours{background:var(--c-yours)}.sw.gap,.hbars b.gap{background:var(--c-gap)}.hbars b.ns{background:var(--line-strong)}
.sw.b-strong,.stack b.b-strong{background:var(--b-strong)}.sw.b-fair,.stack b.b-fair{background:var(--b-fair)}.sw.b-weak,.stack b.b-weak{background:var(--b-weak)}
.hbars{display:grid;gap:7px}
.hrow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13px;border-radius:var(--r);outline-offset:3px}
.hrow .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hl em{font-style:normal;font-size:11px;font-weight:600;background:var(--blue-t);color:var(--blue-ink);border-radius:4px;padding:0 5px;margin-left:4px}
.hrow.me .hl{font-weight:600;color:var(--ink-strong)}
.ht{height:8px;background:var(--line-2);border-radius:0 4px 4px 0;overflow:hidden}
.ht b{display:block;height:100%;border-radius:0 4px 4px 0}
.hv{font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--ink-strong)}
.hv small{font-family:var(--body);color:var(--muted);font-size:11px;margin-left:5px}
.stacks{display:grid;gap:12px}
.srow{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.srow small{color:var(--muted);font-size:11.5px;margin-left:4px;font-variant-numeric:tabular-nums}
.stack{display:flex;gap:2px;height:22px}
.stack b{display:flex;align-items:center;justify-content:center;min-width:4px;color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;border-radius:2px;outline-offset:2px}
.stack b:first-child{border-radius:4px 2px 2px 4px}.stack b:last-child{border-radius:2px 4px 4px 2px}
.stack b.b-weak{color:#0f1a2a}
:root[data-theme="dark"] .stack b.b-strong{color:#0f1a2a}:root[data-theme="dark"] .stack b.b-weak{color:#f0efed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stack b.b-strong{color:#0f1a2a}:root:not([data-theme="light"]) .stack b.b-weak{color:#f0efed}}
.ctab{margin-top:10px;font-size:12px}
.ctab summary{cursor:pointer;color:var(--muted)}
.ctab .tbl{overflow-x:auto;margin-top:6px}
.ctab table{border-collapse:collapse;width:100%;font-size:12.5px}
.ctab th,.ctab td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-2)}
.ctab td.num{text-align:right;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:50;max-width:280px;background:#252525;color:#f0efed;font-size:12px;line-height:1.45;padding:6px 9px;border-radius:var(--r);pointer-events:none;box-shadow:var(--pop)}
[data-tip]:focus-visible{outline:2px solid var(--ring)}

/* ---------- tags (Notion database properties) ---------- */
.chip{display:inline-flex;align-items:center;height:20px;border-radius:4px;padding:0 6px;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--accent) 62%,var(--ink-strong));background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.new{display:inline-flex;align-items:center;height:20px;background:var(--blue-t);color:var(--blue-ink);border-radius:4px;padding:0 6px;font-size:11.5px;font-weight:600;vertical-align:1px}
.urgent{display:inline-flex;align-items:center;height:20px;background:var(--lo-t);color:var(--lo);border-radius:4px;padding:0 6px;font-size:11.5px;font-weight:600;vertical-align:1px}
.xp{display:inline-flex;align-items:center;height:20px;margin-left:6px;border-radius:4px;padding:0 6px;font-size:12px;font-weight:500;color:var(--tag-ink);background:var(--tag);font-variant-numeric:tabular-nums}
.src{display:inline-flex;align-items:center;height:18px;padding:0 2px;font-size:12px;color:var(--faint);margin-left:4px}
.conf{font-size:11.5px;font-weight:500;border-radius:4px;padding:0 6px;background:var(--tag);color:var(--muted)}
.conf.ok{background:var(--hi-t);color:var(--hi)}
.score{display:inline-flex;align-items:center;justify-content:center;width:40px;height:26px;border-radius:var(--r);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.score.s-hi{background:var(--hi-t);color:var(--hi)}
.score.s-mid{background:var(--mid-t);color:var(--mid)}
.score.s-lo{background:var(--lo-t);color:var(--lo)}
.score.weak{background:transparent;border:1px dashed currentColor}

/* ---------- offers: database table ---------- */
.offers{display:flex;flex-direction:column;border-top:1px solid var(--line);background:none}
.offers .thead{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:0 10px;height:36px;align-items:center;font-size:12.5px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line)}
.offer{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 10px;border-bottom:1px solid var(--line-2);transition:background-color .1s}
.offer:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.offer:not(:has(.score)){grid-template-columns:minmax(0,1fr) auto}
.offer h3{margin:0;font-size:14.5px;font-weight:500;line-height:1.4}
.offer h3 a{text-decoration:none}
.offer h3 a:hover{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.offer .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px}
.offer .meta b{color:var(--ink);font-weight:500}
.offer .score{margin-top:1px}
.oa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.oa .btn.primary{background:var(--blue-t);color:var(--blue-ink)}
.oa .btn.primary:hover{background:color-mix(in srgb,var(--blue) 22%,var(--bg))}
.offers.compact{border:0}
.offers.compact .offer{grid-template-columns:56px minmax(0,1fr);padding:10px 0;border-bottom:1px solid var(--line-2)}
.offers.compact .offer:last-child{border-bottom:0}
.offers.compact .offer:hover{background:none}
@media(max-width:640px){.offer{grid-template-columns:48px minmax(0,1fr)}.oa{grid-column:2;justify-content:flex-start;margin-top:6px}.offers .thead{display:none}}
details.why,details.desc{margin-top:6px;display:inline-block;vertical-align:top;margin-right:14px}
details[open].why,details[open].desc{display:block;margin-right:0}
details.why summary,details.desc summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:1px 4px;margin-left:-4px}
details.why summary::-webkit-details-marker,details.desc summary::-webkit-details-marker{display:none}
details.why summary::before,details.desc summary::before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open].why summary::before,details[open].desc summary::before{transform:rotate(90deg)}
details.why summary:hover,details.desc summary:hover{color:var(--ink-strong);background:var(--soft)}
.bars{display:grid;gap:7px;margin-top:8px;padding:14px 16px;background:var(--surface-2);border-radius:var(--rc)}
.bar{display:grid;grid-template-columns:128px 90px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.bar span{font-weight:500;color:var(--ink-strong)}
.bar span small{font-weight:400;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.bar i{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar em{font-style:normal;color:var(--muted);overflow-wrap:anywhere}
.bar.unk{opacity:.5}
@media(max-width:560px){.bar{grid-template-columns:1fr 70px}.bar em{grid-column:1 / -1}}
.an{font-size:13px;color:var(--muted);margin:6px 0 0;white-space:pre-wrap}

/* ---------- rows (radar, search results) ---------- */
.job,.rad{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;border-top:1px solid var(--line-2);padding:12px 0}
.job:first-child,.rad:first-child{border-top:0}
.job h3,.rad h3{margin:0;font-size:14.5px;font-weight:500}
.job h3 a,.rad h3 a{text-decoration:none}
.job h3 a:hover,.rad h3 a:hover{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.job .meta,.rad .meta{font-size:13px;color:var(--muted)}
.rad p{grid-column:1;margin:0;font-size:13px;color:var(--muted)}
.ssh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 4px;font-weight:600;font-size:14.5px;color:var(--ink-strong)}
.ssh:first-child{margin-top:0}
.fchips{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.fchips button{height:30px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:0 12px;font-size:13px;transition:background-color .12s,color .12s,border-color .12s}
.fchips button:hover{background:var(--soft)}
.fchips button[aria-pressed="true"]{background:var(--blue-t);color:var(--blue-ink);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}

/* ---------- category cards: gallery view ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--surface);border:0;border-radius:var(--rc);padding:16px 18px;box-shadow:var(--lift);transition:box-shadow .15s,background-color .15s,transform .15s}
.card:hover{box-shadow:var(--lift-h);transform:translateY(-1px)}
.card .big{font-size:15.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink-strong)}
.card .flag{font-size:24px;line-height:1;margin-bottom:8px}
.card .meta{font-size:13px;color:var(--muted)}
.card .meta b{color:var(--ink-strong);font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.card.dom{background:color-mix(in srgb,var(--tint) 70%,var(--surface))}
.card.dom .big{display:flex;align-items:center;gap:8px}
.card.dom .big::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
.card.dom p{margin:0;font-size:13px;color:var(--muted)}
h2.sec{font-size:15px;font-weight:600;color:var(--ink-strong);margin:36px 0 12px;letter-spacing:-.01em;text-transform:none}
h2.sec:first-of-type{margin-top:4px}
h2.sec.market{margin-top:36px}
.best{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);font-size:13px;line-height:1.4}
.best small{display:block;color:var(--muted);font-size:12px}
.best span:last-child{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.tool .big{font-size:15px}
.card.tool p{margin:0;font-size:13px;color:var(--muted)}
.angle{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px}
@media(max-width:640px){.angle{grid-template-columns:1fr}}
.angle div{background:var(--surface-2);border-radius:var(--rc);padding:12px 16px;font-size:13.5px}
.angle strong{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.angle .e strong{color:var(--ok)}.angle .g strong{color:var(--warn)}
p.tip{font-size:13.5px;color:var(--ink);margin:0 0 20px;padding:12px 16px;border-radius:var(--r);background:var(--surface-2);position:static;max-width:none;box-shadow:none;pointer-events:auto}
.plist{display:grid;gap:0;border-top:1px solid var(--line);background:none}
.plat{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 10px;align-items:center;border-bottom:1px solid var(--line-2);transition:background-color .1s}
.plat:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.plat h3{margin:0;font-size:14.5px;font-weight:500}
.plat h3 a{text-decoration:none}.plat h3 a:hover{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.kind{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.plat p{grid-column:1;margin:0;font-size:13px;color:var(--muted)}
.plat .log{font-size:12px;color:var(--muted)}
.prio{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.prio i{width:6px;height:6px;border-radius:2px;background:var(--line-strong)}
.prio i.on{background:var(--ink-strong)}
.status{grid-column:2;grid-row:1 / span 3;height:28px;border:0;background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:0 10px;font-size:12.5px;font-weight:500;min-width:96px;text-align:center}
.status[data-s="exploring"]{background:var(--mid-t);color:var(--mid)}
.status[data-s="applied"]{background:var(--blue-t);color:var(--blue-ink)}
.status[data-s="skip"]{text-decoration:line-through;color:var(--muted)}
.plat.skipped{opacity:.55}
.notes textarea{min-height:100px}

/* ---------- applications: board + list ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(186px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:0;border-radius:var(--rc);padding:8px;min-height:120px;transition:background-color .12s,box-shadow .12s}
.col.over{background:var(--blue-t);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 40%,transparent)}
.colh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-size:13.5px;font-weight:600;color:var(--ink-strong)}
.colh span{font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.kcards{display:flex;flex-direction:column;gap:6px}
.kcard{display:block;text-align:left;width:100%;background:var(--surface);border:0;border-radius:8px;padding:10px 12px;box-shadow:var(--lift);cursor:grab;transition:box-shadow .12s,background-color .12s}
.kcard:hover{box-shadow:var(--lift-h)}
.kcard.dragging{opacity:.4;user-select:none}
.kcard b{display:block;font-size:14px;font-weight:500;color:var(--ink-strong)}
.kcard small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.kcard .kmeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.kcard .kres{margin-left:auto;font-size:11.5px;font-weight:500;border-radius:4px;padding:0 6px;background:var(--tag);color:var(--tag-ink)}
.kcard .kres.r-rejected{color:var(--lo);background:var(--lo-t)}.kcard .kres.r-accepted{color:var(--hi);background:var(--hi-t)}
.kempty{font-size:12.5px;color:var(--faint);text-align:center;padding:16px 4px}
.seg{display:inline-flex;border-radius:var(--r);padding:2px;background:var(--soft)}
.seg button{height:26px;border:0;background:transparent;border-radius:4px;padding:0 10px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:background-color .12s,color .12s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink-strong);box-shadow:var(--lift)}
.seg svg.ic{width:15px;height:15px}
.app{background:none;border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:14px 4px;margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.app h3{margin:0;font-size:14.5px;font-weight:500}
.app h3 small{font-weight:400;color:var(--muted);font-size:13px}
.app .meta{font-size:13px;color:var(--muted)}
.app .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1 / -1}
.app .ctl select{width:auto;height:28px;font-size:12.5px}
.app .an{grid-column:1 / -1}
.imp{background:var(--surface-2);border-radius:var(--rc);padding:18px 20px;margin-bottom:20px}
.imp textarea{min-height:130px;margin:8px 0}
.cand{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.cand b{font-size:14px;font-weight:500}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}

/* ---------- profile ---------- */
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{height:26px;border:0;background:var(--tag);border-radius:4px;padding:0 9px;font-size:12.5px;color:var(--muted);transition:background-color .12s,color .12s}
.skill:hover{color:var(--ink-strong);background:color-mix(in srgb,var(--tag) 70%,var(--muted))}
.skill[aria-pressed="true"]{background:var(--blue-t);color:var(--blue-ink);font-weight:500}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px 28px}
.fam .lab{margin-bottom:8px;color:var(--muted);font-weight:500;font-size:12.5px}
.found{margin-top:12px;font-size:13.5px;background:var(--surface-2);border-radius:var(--r);padding:0 14px;line-height:1.6}
.found:not(:empty){padding:12px 16px}
.found:empty{display:none}
.order{list-style:none;margin:0;padding:0;counter-reset:o;display:flex;flex-direction:column;gap:0}
.order li{counter-increment:o;display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line-2)}
.order li::before{content:counter(o);font-size:12.5px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.order .btn.sm{height:26px;padding:0 8px}

/* ---------- notes ---------- */
.note{background:var(--surface);border:0;border-radius:var(--rc);padding:14px 16px;margin-bottom:14px;display:grid;gap:8px;box-shadow:var(--lift)}
.note .top2{display:flex;gap:8px;flex-wrap:wrap}
.note input[type=text]{font-weight:500;flex:1;min-width:160px}
.note select{width:auto}
.note textarea{min-height:110px}
.note small{color:var(--muted);font-size:12px}
.rn{display:block;padding:10px 4px;border-bottom:1px solid var(--line-2);text-decoration:none;font-size:13.5px;transition:background-color .1s}
.rn:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.rn b{display:block;font-size:14.5px;font-weight:500;color:var(--ink-strong)}
.rn a{text-decoration:none}.rn a:hover{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.rn span{color:var(--muted);white-space:pre-wrap}

/* ---------- dialogs ---------- */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:var(--pop);overscroll-behavior:contain}
dialog::backdrop{background:rgba(15,15,15,.45)}
.dl{padding:24px;display:grid;gap:14px}
.dl h2{margin:0;font-size:19px}
.dl label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.dl textarea{min-height:70px}
.dl .acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

.stories{display:grid;gap:12px}
.story{border:0;border-radius:var(--rc);padding:14px 16px;background:var(--surface-2)}
.story .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.story .sh b{font-weight:600;color:var(--ink-strong)}
.story .meta{font-size:13px;color:var(--muted);margin:2px 0 6px}
.story p{margin:6px 0 0;font-size:14px}
.story .qs{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.story .qs li{margin:3px 0}
.ctc{margin-top:4px}
.mono{font-family:var(--mono);font-size:.92em}
.colink{text-decoration:none}
.linkbtn{border:0;background:none;padding:0;color:var(--blue-ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--blue) 35%,transparent);text-underline-offset:2px;font-size:inherit;cursor:pointer}
.colink:hover{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line-2);color:var(--faint);font-size:12.5px}
.foot button{border:0;background:none;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:2px;color:var(--muted);padding:0;font-size:12.5px}
.foot button:hover{color:var(--ink-strong)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}



/* ---------- Brand: navy and red from the logo. Sora headings, Inter body ----------
   Navy (--blue) carries actions and links; the logo red (--red) marks what needs attention: new, urgent, the hero.
   Shape rule: buttons and tags full pill, inputs 14px, cards 22-28px. */
:root{
  --canvas:#f3f5fa;--bg:#f3f5fa;--surface:#ffffff;--surface-2:#f6f8fc;--soft:#e8ecf5;--side-h:#e2e7f2;
  --ink:#1c2747;--ink-strong:#0f1b3d;--muted:#5f6a86;--faint:#97a0b6;
  --line:#e1e6f0;--line-2:#edf0f6;--line-strong:#d0d7e5;--ring:#1e3a8a;
  --blue:#1e3a8a;--blue-h:#172f72;--blue-t:#e8edf9;--blue-ink:#1e3a8a;
  --red:#e63946;--red-ink:#c62533;--red-t:#fdeaec;
  --job:#0f9d6b;--master:#2563eb;--phd:#7c3aed;--job-t:#e4f7ef;--master-t:#e9f0fe;--phd-t:#f2ebfe;
  --ok:#0f9d6b;--warn:#f08c00;--bad:#d62839;
  --hi:#0b7a53;--hi-t:#e2f6ed;--mid:#8a5300;--mid-t:#fff2dc;--lo:#b3202f;--lo-t:#fde8ea;
  --tag:#edf0f6;--tag-ink:#37425f;
  --c-yours:#1e3a8a;--c-gap:#e63946;--b-strong:#1e3a8a;--b-fair:#4f6fd1;--b-weak:#a9b8e8;
  --display:'Sora','Twemoji Country Flags',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter','Twemoji Country Flags',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --card-sh:0 1px 2px rgba(15,27,61,.05);--card-sh-h:0 18px 36px -18px rgba(15,27,61,.28);
  --pop:0 0 0 1px rgba(15,27,61,.06),0 28px 56px -16px rgba(15,27,61,.3)}
:root[data-theme="dark"]{color-scheme:dark;
  --canvas:#0a1022;--bg:#0a1022;--surface:#111a33;--surface-2:#16213f;--soft:#1d2a4c;--side-h:#18234a;
  --ink:#e2e7f3;--ink-strong:#f6f8fc;--muted:#9aa4bf;--faint:#6a7596;
  --line:#222e50;--line-2:#1a2444;--line-strong:#303d64;--ring:#8aa4ff;
  --blue:#6f8eff;--blue-h:#8aa4ff;--blue-t:#1a2552;--blue-ink:#c2cfff;
  --red:#ff5c69;--red-ink:#ff8a94;--red-t:#3d1a24;
  --job:#34d399;--master:#60a5fa;--phd:#a78bfa;--job-t:#0f2f24;--master-t:#16264a;--phd-t:#251c45;
  --ok:#34d399;--warn:#ffa94d;--bad:#ff6b7a;
  --hi:#c6f4df;--hi-t:#113629;--mid:#ffe2b0;--mid-t:#3d2c0e;--lo:#ffd1d6;--lo-t:#46191f;
  --tag:#1d2a4c;--tag-ink:#dde3f1;
  --c-yours:#6f8eff;--c-gap:#ff5c69;--b-strong:#a9b8ff;--b-fair:#6f8eff;--b-weak:#2c3f86;
  --card-sh:none;--card-sh-h:0 0 0 1px #34416e;
  --pop:0 0 0 1px #27335a,0 24px 48px -12px rgba(0,0,0,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --canvas:#0a1022;--bg:#0a1022;--surface:#111a33;--surface-2:#16213f;--soft:#1d2a4c;--side-h:#18234a;
  --ink:#e2e7f3;--ink-strong:#f6f8fc;--muted:#9aa4bf;--faint:#6a7596;
  --line:#222e50;--line-2:#1a2444;--line-strong:#303d64;--ring:#8aa4ff;
  --blue:#6f8eff;--blue-h:#8aa4ff;--blue-t:#1a2552;--blue-ink:#c2cfff;
  --red:#ff5c69;--red-ink:#ff8a94;--red-t:#3d1a24;
  --job:#34d399;--master:#60a5fa;--phd:#a78bfa;--job-t:#0f2f24;--master-t:#16264a;--phd-t:#251c45;
  --ok:#34d399;--warn:#ffa94d;--bad:#ff6b7a;
  --hi:#c6f4df;--hi-t:#113629;--mid:#ffe2b0;--mid-t:#3d2c0e;--lo:#ffd1d6;--lo-t:#46191f;
  --tag:#1d2a4c;--tag-ink:#dde3f1;
  --c-yours:#6f8eff;--c-gap:#ff5c69;--b-strong:#a9b8ff;--b-fair:#6f8eff;--b-weak:#2c3f86;
  --card-sh:none;--card-sh-h:0 0 0 1px #34416e;
  --pop:0 0 0 1px #27335a,0 24px 48px -12px rgba(0,0,0,.7)}}
body{background:var(--canvas);font-size:15px;font-weight:500}

/* icon rail */
.shell{grid-template-columns:104px minmax(0,1fr)}
.side{background:transparent;box-shadow:none;padding:22px 0;align-items:center;gap:6px}
.brand{width:52px;height:52px;padding:0;margin:0 0 18px;justify-content:center;border-radius:14px;background:transparent;box-shadow:0 4px 14px -6px rgba(15,27,61,.35)}
:root[data-theme="dark"] .brand{background:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{background:transparent}}
.brand:hover{background:transparent;transform:translateY(-1px)}
.brand .logo-mark{width:52px;height:52px;border-radius:14px;display:block}
.brand span{display:none}
.navlab{display:none}
.tabs{gap:4px;align-items:center}
.tabs a,:root[data-theme="dark"] .tabs a{flex-direction:column;justify-content:center;gap:5px;width:80px;height:66px;padding:0 4px;border-radius:20px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;border:0;line-height:1.1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs a{color:var(--muted)}}
.tabs a svg{width:22px;height:22px;color:var(--faint)}
.tabs a:hover{background:var(--side-h);color:var(--ink-strong)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink-strong);box-shadow:0 6px 18px -8px rgba(15,27,61,.22)}
.tabs a[aria-current="page"] svg{color:var(--blue)}
.side-foot{padding:10px 6px}
.side .syncl{font-size:11px;justify-content:center;text-align:center}
.main{margin:0;background:transparent;border:0;border-radius:0;box-shadow:none;min-height:100dvh}
.topbar{height:58px;background:color-mix(in srgb,var(--canvas) 86%,transparent);border:0;border-radius:0;padding-inline:40px}
.iconbtn{background:var(--surface);border:0;border-radius:999px;width:38px;height:38px;box-shadow:var(--card-sh)}
.wrap{max-width:1200px;padding:20px 40px 72px;margin:0}

/* editorial type */
h1{font-family:var(--display);font-weight:500;font-size:50px;line-height:1.04;letter-spacing:-.025em;color:var(--ink-strong);max-width:22ch}
h1 b{font-weight:600}
h1 em{font-style:italic;color:var(--warn)}
.kicker{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted)}
.sub{font-size:16px;color:var(--muted);margin:10px 0 30px;max-width:62ch}
h2{font-family:var(--body);font-weight:800;font-size:17px;letter-spacing:-.01em}
h2.sec{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-.02em;margin:44px 0 16px}
.crumbs{font-weight:600}

/* controls */
.btn{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:14px;box-shadow:none;transition:background-color .15s,border-color .15s,transform .08s,box-shadow .15s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn.primary{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px color-mix(in srgb,var(--blue) 90%,transparent)}
.btn.primary:hover{background:var(--blue-h)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.oa .btn.primary{background:var(--blue-t);color:var(--blue-ink);box-shadow:none}
.oa .btn.primary:hover{background:color-mix(in srgb,var(--blue) 20%,var(--surface))}
select,input[type=text],input[type=date],input[type=url],input[type=number],input[type=password],input[type=search],input[type=email],textarea{height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:none;font-weight:500}
textarea{height:auto}
.toolbar select,.filters select,.toolbar input[type=search]{height:40px}
.sc,.fchips button{height:38px;border-radius:999px;padding:0 16px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.sc:has(input:checked),.fchips button[aria-pressed="true"]{background:var(--blue-t);color:var(--blue-ink);border-color:transparent}
.seg{border-radius:999px;padding:4px;background:var(--surface);box-shadow:var(--card-sh)}
.seg button{height:32px;border-radius:999px;padding:0 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink-strong);color:var(--bg);box-shadow:none}

/* white cards on the soft canvas */
.panel{background:var(--surface);border:0;border-radius:26px;padding:24px 26px;margin-bottom:20px;box-shadow:var(--card-sh)}
.panel:has(> #colBox){padding:0;background:none;box-shadow:none}
.two,.charts{gap:20px;margin-bottom:20px}
.charts .panel{border:0;border-radius:26px;padding:24px 26px}
.empty{background:transparent;padding:6px 0;text-align:left}
.panel.empty{background:var(--surface);padding:24px 26px}
.demo,.nudge,p.tip{border:0;background:var(--surface);border-radius:18px;box-shadow:var(--card-sh)}

/* stats: white tiles; on Overview the first one is the gradient hero card */
.stats{gap:16px;margin-bottom:20px}
.stat,.stat:first-child{border:0;border-radius:22px;padding:20px 22px;background:var(--surface);box-shadow:var(--card-sh)}
.stat span{font-weight:700;color:var(--muted);font-size:13px}
.stat b{font-family:var(--display);font-weight:600;font-size:46px;letter-spacing:-.03em;margin-top:6px;line-height:1.05}
.stat small{color:var(--faint);font-weight:600}
#ovH{margin-bottom:34px}
#weekBox .stats{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
#weekBox .stat:not(:first-child){display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:18px;align-items:center;padding:16px 22px}
#weekBox .stat:not(:first-child) b{grid-row:1 / 3;order:0;margin:0;font-size:42px;min-width:56px}
#weekBox .stat:not(:first-child) span{order:1}#weekBox .stat:not(:first-child) small{order:2}
#weekBox .stat:first-child{grid-row:span 3;justify-content:center;padding:30px 32px;border-radius:30px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(230,57,70,.55) 0%,rgba(230,57,70,0) 55%),linear-gradient(145deg,#1e3a8a 0%,#0f1b3d 100%);box-shadow:0 24px 44px -22px rgba(15,27,61,.75)}
#weekBox .stat:first-child span,#weekBox .stat:first-child small{color:rgba(255,255,255,.88)}
#weekBox .stat:first-child b{color:#fff;font-size:92px;font-family:var(--body);font-weight:800;letter-spacing:-.05em;margin:6px 0 4px}
.hero-cta{display:none}
#weekBox .stat:first-child .hero-cta{order:3;display:inline-flex;align-self:flex-start;align-items:center;height:42px;margin-top:16px;padding:0 20px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:14px;text-decoration:none}

/* tags and scores */
.chip{height:24px;border-radius:999px;padding:0 10px;font-size:12px;font-weight:700}
.xp,.conf,.new,.urgent,.kcard .kres{border-radius:999px;padding:0 9px;height:24px;font-weight:700}
.urgent{background:var(--red-t);color:var(--red-ink)}
.xp.pst.s-hi{background:var(--hi-t);color:var(--hi)}.xp.pst.s-mid{background:var(--mid-t);color:var(--mid)}.xp.pst.s-lo{background:var(--lo-t);color:var(--lo)}
.offer.pj .meta+.meta{margin-top:6px}
.pjt{font:inherit;color:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.pjt:hover{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.pjlogo{vertical-align:-3px;margin-right:8px;border-radius:5px}
.pjd{margin-top:14px;padding:16px 18px;border-radius:18px;background:var(--surface-2);font-size:14px}
.pjd h4,.pjlive h4{margin:14px 0 6px;font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink-strong)}
.pjd h4:first-child{margin-top:0}.pjd p{margin:0 0 8px}
.pq{margin:6px 0;padding:9px 12px;border-left:3px solid var(--ok);background:var(--surface);border-radius:10px;font-size:13.5px}
.pq.neg{border-left-color:var(--red)}.pq small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.pjlive{margin-top:10px}.pjlive .offers.compact .offer{grid-template-columns:minmax(0,1fr)}
.pjf fieldset{border:0;padding:0;margin:0 0 12px}.pjf legend{font-weight:700;font-size:13px;color:var(--muted);margin-bottom:6px}
.pjf .ck{display:inline-flex;gap:6px;align-items:center;margin:0 14px 6px 0;font-size:13.5px;cursor:pointer}
.pjf .pjsub{display:block;margin:0 0 6px 22px}
.pjacts{margin-top:10px}
.acems{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13.5px}.acem small{color:var(--muted)}.acem.guess .mono{color:var(--muted);font-style:italic}.pnav{width:28px;height:28px;border-radius:50%;vertical-align:-8px;margin-right:10px;object-fit:cover}
.new{background:var(--red-t);color:var(--red-ink)}
.score{width:48px;height:48px;border-radius:16px;font-weight:800;font-size:15px}
.score.weak{border:0;background:var(--surface-2);font-size:20px}

/* lists inside one white card */
.offers{border:0;border-radius:26px;overflow:hidden;background:var(--surface);box-shadow:var(--card-sh)}
.offers .thead{background:transparent;border-bottom:1px solid var(--line-2);padding:0 20px;height:44px;grid-template-columns:64px minmax(0,1fr) auto}
.offer{grid-template-columns:64px minmax(0,1fr) auto;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.offer:last-child{border-bottom:0}
.offer:hover{background:var(--surface-2)}
.offer h3{font-weight:700;font-size:15.5px}
.offers.compact{border-radius:0;box-shadow:none;background:none;overflow:visible}
.offers.compact .offer{grid-template-columns:64px minmax(0,1fr);padding:12px 0}
.plist{border:0;border-radius:26px;overflow:hidden;background:var(--surface);box-shadow:var(--card-sh)}
.plat{padding:16px 20px}.plat:last-child{border-bottom:0}
.bars{background:var(--surface-2);border:0;border-radius:18px}
.card{border:0;border-radius:24px;padding:20px 22px;background:var(--surface);box-shadow:var(--card-sh);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--card-sh-h);transform:translateY(-2px)}
.card .big{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.015em}
.card.dom{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,var(--surface)) 0,var(--surface) 75%)}
.card.dom .big::before{width:10px;height:10px;border-radius:50%}
.card.dom .big{align-items:baseline}.card.dom .big::before{flex:0 0 auto;transform:translateY(-2px)}
.col{background:color-mix(in srgb,var(--surface) 55%,transparent);border:0;border-radius:26px;padding:12px}
.colh{font-weight:800}
.kcard{border:0;border-radius:18px;box-shadow:var(--card-sh)}
.kcard:hover{box-shadow:var(--card-sh-h)}
.app{background:var(--surface);border:0;border-radius:22px;padding:16px 20px;margin-bottom:12px;box-shadow:var(--card-sh)}
.note{border:0;border-radius:24px;box-shadow:var(--card-sh)}
.story{border:0;border-radius:20px;background:var(--surface-2)}
.skill{border-radius:999px;height:32px;padding:0 13px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.skill[aria-pressed="true"]{background:var(--blue-t);color:var(--blue-ink);border-color:transparent}
.imp,.found{border:0;border-radius:20px;background:var(--surface);box-shadow:var(--card-sh)}
dialog{border-radius:28px;box-shadow:var(--pop)}
.foot{border-top:1px solid var(--line)}


/* ---------- redesign: section tabs, drawer, compact rows ---------- */
.subnav{display:flex;gap:6px;margin:0 0 22px;overflow-x:auto;scrollbar-width:none}
.subnav[hidden]{display:none}
.subnav a{flex:0 0 auto;display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;background:transparent}
.subnav a:hover{background:var(--surface);color:var(--ink-strong)}
.subnav a[aria-current="page"]{background:var(--ink-strong);color:var(--bg)}
.tabs a,:root[data-theme="dark"] .tabs a{font-size:12px}
.two.one{grid-template-columns:1fr}
.panel[hidden]{display:none}
.skfold>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--blue-ink);margin:6px 0 10px;list-style:none}
.skfold>summary::-webkit-details-marker{display:none}
.skfold>summary::before{content:"▸ ";}.skfold[open]>summary::before{content:"▾ ";}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:40;background:var(--surface);box-shadow:var(--pop);overflow-y:auto;overscroll-behavior:contain;transform:translateX(105%);transition:transform .22s ease;visibility:hidden}
.has-drawer .drawer{transform:none;visibility:visible}
.drawer-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.drawer-top b{font-family:var(--display);font-size:16px;color:var(--ink-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-body{padding:18px 20px 40px}
.drawer-body .pjd{margin:0;background:none;padding:0}
.drawer-body .offer{grid-template-columns:minmax(0,1fr);padding:12px 0}
.drawer-scrim{position:fixed;inset:0;z-index:39;background:rgba(10,16,34,.28);opacity:0;pointer-events:none;transition:opacity .2s}
.has-drawer .drawer-scrim{opacity:1;pointer-events:auto}
@media(min-width:1280px){.has-drawer .drawer-scrim{background:transparent}}
.rowbtn{cursor:pointer}
.rowbtn:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.acline{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:13px;color:var(--muted);margin-top:3px}
.acline b{color:var(--ink);font-weight:600}
.mailok{color:var(--ok);font-weight:700}.mailguess{color:var(--warn);font-weight:700}
@media(max-width:900px){
  .subnav{margin:0 -16px 18px;padding:0 16px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stats .stat:first-child:last-child{grid-column:1/-1}
  .stats .stat:last-child:nth-child(odd){grid-column:1/-1}
  #view>.sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #view>h1{font-size:30px}
  .stat b{font-size:28px}
  #weekBox .stat:first-child b{font-size:56px}
  #weekBox .stat:first-child{padding:20px 22px;border-radius:24px}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px}
  .toolbar>*{flex:0 0 auto}
  .toolbar input[type=search]{min-width:220px;max-width:none}
  .drawer{width:100vw}
  .drawer-body{padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
  .bottombar{grid-template-columns:repeat(5,1fr)}
}

/* ---------- phones (last, so it wins over the desktop rules above) ---------- */
.bottombar,.sheet,.tb-logo,.fbtn{display:none}
@media(max-width:900px){
  .shell{display:block}
  .side{display:none}
  .topbar{height:52px;padding-inline:16px;gap:10px;box-shadow:0 1px 0 var(--line-2)}
  .tb-logo{display:inline-flex;color:var(--ink-strong)}
  .tb-app{display:none}
  .topbar .where b{font-size:15px;font-weight:600}
  .wrap{padding-inline:16px;padding-block:20px calc(88px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);box-shadow:0 -1px 0 var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottombar a,.bottombar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;border:0;background:none;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;border-radius:10px}
  .bottombar svg.ic{width:23px;height:23px}
  .bottombar [aria-current="page"]{color:var(--ink-strong)}
  .bottombar [aria-current="page"] svg{color:var(--blue)}
  .sheet:not([hidden]){display:flex;flex-direction:column;gap:2px;position:fixed;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;min-width:230px;background:var(--surface);border-radius:12px;padding:6px;box-shadow:var(--pop);overscroll-behavior:contain}
  .sheet a,.sheet button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;background:none;border-radius:8px;text-decoration:none;color:var(--ink-strong);font-size:15px;text-align:left}
  .sheet a:hover,.sheet button:hover{background:var(--soft)}
  .sheet .syncl{padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:4px}
  h1{font-size:34px;max-width:none}
  h2.sec{font-size:24px;margin:34px 0 12px}
  .topbar{padding-inline:16px}
  .wrap{padding:16px 16px calc(88px + env(safe-area-inset-bottom,0px))}
  .panel{padding:18px;border-radius:22px}
  .stat,.stat:first-child,.stat:nth-child(odd){padding:16px;border-radius:20px;border:0}
  #weekBox .stats{grid-template-columns:1fr}
  #weekBox .stat:first-child{grid-row:auto}
  #coBox{--cw:50px}
  #coBox .offers.hp{--hpc:3;--hpw:66px}
  #coBox .offers.hp .hpx{display:none}
  #coBox .offer{gap:4px 8px}
  #coBox .offer h3{font-size:14px}
  #coBox .thead{font-size:11px;gap:8px}
  #weekBox .stat:first-child{padding:22px}
  #weekBox .stat:first-child b{font-size:64px}
  .stat b{font-size:34px}
  .offer{grid-template-columns:52px minmax(0,1fr);padding:14px}
  .offers.compact .offer{grid-template-columns:52px minmax(0,1fr);padding:12px 0}
  .score{width:44px;height:44px}
  .bottombar [aria-current="page"] svg{color:var(--blue)}
  .sheet:not([hidden]){display:flex;flex-direction:column;gap:2px;position:fixed;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;min-width:230px;background:var(--surface);border-radius:12px;padding:6px;box-shadow:var(--pop);overscroll-behavior:contain}
  .sheet a,.sheet button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;background:none;border-radius:8px;text-decoration:none;color:var(--ink-strong);font-size:15px;text-align:left}
  .sheet a:hover,.sheet button:hover{background:var(--soft)}
  .sheet .syncl{padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:4px}
  h1{font-size:28px}
  body{background:var(--bg)}
  .main{margin:0;border:0;border-radius:0;box-shadow:none;min-height:100dvh}
  .topbar{border-radius:0}
  .wrap{padding-top:22px}
  .panel{padding:16px;border-radius:14px}
  .stat,.stat:first-child,.stat:nth-child(odd){padding:14px 16px 16px;border-radius:14px;border:1px solid var(--line)}
  .stat:first-child{border-color:transparent}
  .stat b{font-size:30px}
  .offer{padding:14px 12px}
  .offers.compact .offer{padding:12px 0}
  .bottombar [aria-current="page"] svg{color:var(--blue)}
  .sub{margin-bottom:20px;font-size:14.5px}
  .panel,.stats,.two,.charts{margin-bottom:32px}
  /* offer lists: search and sort always visible, the other filters behind "Filters" */

/* Sync with Neon, item by item. `synced` is the copy last confirmed by the server; a save sends only what
   differs from it (changed items, deleted items, changed settings), and the newest edit of each item wins on the

const SYNC_LISTS=['apps','saved','journal','searches','feeds','queue'],SYNC_SET=['profile','status','notes','companyNotes','seen','seenAt','mailSeen','oppsHidden','oppsSeenAt'],SKEY='parcours-synced';
const SEP='\u0001';
let synced=(()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){return null;}})();
function persistSynced(){try{localStorage.setItem(SKEY,JSON.stringify(synced));}catch(e){}}
function snapshotOf(s){const items={},settings={};SYNC_LISTS.forEach(c=>(s[c]||[]).forEach(x=>{if(x&&x.id)items[c+SEP+x.id]=JSON.stringify(x);}));SYNC_SET.forEach(k=>{settings[k]=JSON.stringify(s[k]===undefined?null:s[k]);});return {items,settings};}
function diffSince(base){
  const now=Date.now(),cur=snapshotOf(state),items=[],settings=[];
  for(const [k,v] of Object.entries(cur.items))if(base.items[k]!==v){const [c,id]=k.split(SEP);items.push({c,id,data:JSON.parse(v),ts:now});}
  for(const k of Object.keys(base.items))if(!(k in cur.items)){const [c,id]=k.split(SEP);items.push({c,id,data:null,ts:now});}
  for(const [k,v] of Object.entries(cur.settings))if(base.settings[k]!==v)settings.push({k,data:JSON.parse(v),ts:now});
  return {items,settings,cur};
}
function applyPending(s,d){
  for(const it of d.items){const l=s[it.c]||(s[it.c]=[]);const i=l.findIndex(x=>x&&x.id===it.id);
    if(it.data==null){if(i>=0)l.splice(i,1);}else if(i>=0)l[i]=it.data;else if(it.c==='saved'||it.c==='journal')l.unshift(it.data);else l.push(it.data);}
  for(const x of d.settings)s[x.k]=x.data;
}
function save(){

}
async function flush(){
  if(saving){timer=setTimeout(flush,300);return;}
  if(!dirty||!caps.sync||!pulled)return; // never push before the server copy is known
  saving=true;dirty=false;
  const d=diffSince(synced||{items:{},settings:{}});
  if(!d.items.length&&!d.settings.length){saving=false;setSync('saved');return;}
  try{await api('/api/state',{method:'PUT',body:JSON.stringify({changes:{items:d.items,settings:d.settings}})});synced=d.cur;persistSynced();setSync('saved');}
  catch(e){setSync('error');}
  saving=false;if(dirty)flush();
}
async function pull(){
  try{
    const r=await api('/api/state');
    pulled=true;
    if(demo)return;
    if(!r||!r.state){if(hasData(state)){dirty=true;flush();}else setSync('saved');return;}
    const remote=Object.assign(emptyState(),r.state),remoteSnap=snapshotOf(remote);
    // Edits made here and not yet confirmed survive the download. With no confirmed copy yet (first sync on
    // this device), local data that is newer than the server's counts as such an edit.
    const pend=synced?diffSince(synced):((state.updatedAt||0)>(remote.updatedAt||0)?diffSince(remoteSnap):null);
    const before=JSON.stringify(snapshotOf(state));
    if(pend)applyPending(remote,pend);
    state=remote;synced=remoteSnap;persistSynced();persistLocal();
    if(JSON.stringify(snapshotOf(state))!==before)route();
    if(pend&&(pend.items.length||pend.settings.length)){dirty=true;flush();}else setSync('saved');
  }catch(e){setSync('error');}
}

function parseJsonLoose(t){
  const tryP=x=>{try{return {v:JSON.parse(x)};}catch(e){return null;}};
  let r=tryP(t.trim());if(r)return r.v;
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){r=tryP(f[1].trim());if(r)return r.v;}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(a>=0&&b>a){r=tryP(t.slice(a,b+1));if(r)return r.v;}
  throw {code:'invalid_json',message:'Could not read the answer.',text:t};
}

function timelineSvg(apps){
  const rows=COUNTRIES.filter(c=>apps.some(a=>a.c===c.id));
  const W=760,L=112,R=22,T=14,RH=48,B=30,H=T+rows.length*RH+B;
  const now=Date.now();
  let min=Math.min(...apps.map(a=>tms(a.date)),now-56*DAY)-3*DAY;
  const max=now+4*DAY;
  const x=ms=>L+(ms-min)/(max-min)*(W-L-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of applications by country">`;
  rows.forEach((c,i)=>{const y=T+i*RH+RH/2;
    s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="tb" x="0" y="${y+4}">${c.flag} ${esc(c.name.length>11?c.name.slice(0,10)+'…':c.name)}</text>`;});
  const d0=new Date(min);let cur=new Date(d0.getFullYear(),d0.getMonth()+1,1);
  while(cur.getTime()<max){const px=x(cur.getTime());
    s+=`<line class="grid" x1="${px}" x2="${px}" y1="${T}" y2="${H-B}"/><text class="t" x="${px+4}" y="${H-10}">${cur.toLocaleDateString('en',{month:'short'})}</text>`;
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  s+=`<line class="today" x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H-B}"/><text class="t" x="${x(now)-14}" y="${H-10}">Today</text>`;
  const seen={};const rad={applied:5,replied:6.5,interview:8,offer:10};
  [...apps].sort((a,b)=>tms(a.date)-tms(b.date)).forEach(a=>{
    const ri=rows.findIndex(c=>c.id===a.c);if(ri<0)return;
    const key=a.c+'|'+a.date;const k=seen[key]=(seen[key]||0)+1;const j=k-1;
    const cx=x(tms(a.date))+Math.floor(j/3)*10, cy=T+ri*RH+RH/2+((j%3)-1)*12;
    const col=`var(${(DOM[a.d]||DOM.job).color})`;
    const rej=a.result==='rejected';
    const fill=rej?'var(--surface)':col;
    const op=a.result==='withdrawn'?.35:1;
    const ring=a.result==='accepted'?'stroke:var(--ink);stroke-width:2.5':`stroke:${col};stroke-width:2`;
    s+=`<circle class="dot" data-id="${esc(a.id)}" cx="${cx.toFixed(1)}" cy="${cy}" r="${rad[a.stage]||5}" style="fill:${fill};${ring}" opacity="${op}" tabindex="0"><title>${esc(a.org)}${a.role?', '+esc(a.role):''} (${STAGE_LABEL[a.stage]}, ${RES_LABEL[a.result]}, ${a.date})</title></circle>`;
  });
  return s+'</svg>';
}
function funnel(m){
  const steps=[['Applied',m.n],['Got a reply',m.replied],['Interview',m.inter],['Offer',m.offers]];
  return steps.map(([l,v])=>`<div class="frow"><span class="nm">${l}</span><span class="tr"><i style="width:${m.n?Math.round(v/m.n*100):0}%"></i></span><span class="v"><b>${v}</b> ${pct(v,m.n)}</span></div>`).join('');
}
function platforms(apps){
  const map={};
  apps.forEach(a=>{const k=a.p||'Other / direct';(map[k]=map[k]||{n:0,r:0});map[k].n++;if(gotReply(a))map[k].r++;});
  const list=Object.entries(map).sort((a,b)=>b[1].n-a[1].n).slice(0,8);const mx=list[0][1].n;

}
function matrix(apps){
  let h=`<div class="mxw"><div class="mx"><div class="h"></div>${Object.values(DOM).map(v=>`<div class="h">${v.label}</div>`).join('')}`;

const normOrg=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function matchApp(org,role){
  const o=normOrg(org),r=normOrg(role);if(o.length<2)return null;
  const hits=state.apps.filter(a=>{const x=normOrg(a.org);return x&&(x===o||(Math.min(x.length,o.length)>=4&&(x.includes(o)||o.includes(x))));});
  const roleHit=a=>r&&normOrg(a.role)===r?1:0;
  return hits.sort((a,b)=>roleHit(b)-roleHit(a)||tms(b.date)-tms(a.date))[0]||null;
}
function gmPlan(x){
  const e={c:cById(x.c)?x.c:'fr',d:DOM[x.d]?x.d:'job',stage:STAGES.includes(x.stage)?x.stage:'applied',result:RES.includes(x.result)?x.result:'open'};

function offerLang(q){
  const t=((q.title||'')+' '+(q.desc||'').slice(0,1500)).toLowerCase();

function cleanTitle(t,kind,lang){

/* search: every word must match (in any order), synonyms count, "-word" excludes; title hits rank highest */
const SYN=[['ml','machine learning','apprentissage automatique'],['ai','ia','artificial intelligence','intelligence artificielle','ki'],['nlp','natural language processing','tal','traitement automatique des langues'],
  ['llm','llms','large language model','genai','generative ai','ia generative'],['cv','computer vision','vision par ordinateur'],['ds','data science','data scientist'],['de','data engineer','data engineering'],
  ['dev','developer','developpeur','entwickler'],['phd','doctorat','doctoral','doctorant','these','thesis'],['stage','internship','intern','stagiaire','pfe'],['remote','teletravail','full remote','homeoffice'],
  ['backend','back end','back-end'],['fullstack','full stack','full-stack'],['junior','entry level','jeune diplome','debutant'],['engineer','ingenieur','engineering']];
const qNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9+#.\- ]+/g,' ').replace(/\s+/g,' ').trim();
function parseQuery(q){
  const raw=qNorm(q);if(!raw)return null;
  const words=raw.split(' ').filter(Boolean),inc=[],exc=[];
  for(let i=0;i<words.length;i++){
    let w=words[i];const neg=w.startsWith('-')&&w.length>1;if(neg)w=w.slice(1);
    // two-word synonyms typed as words ("machine learning") stay one term
    const two=words[i+1]?w+' '+words[i+1].replace(/^-/,''):'';
    const group=SYN.find(g=>g.includes(two))||null;
    if(group&&two){i++;(neg?exc:inc).push(group);continue;}
    (neg?exc:inc).push(SYN.find(g=>g.includes(w))||[w]);
  }
  return {inc,exc};
}
const hasTerm=(text,t)=>(' '+text+' ').includes(' '+t+' ')||(t.length>=4&&text.includes(t));
function textMatch(x,pq){
  if(!pq)return 1;
  const ti=' '+qNorm(x.title)+' ',org=' '+qNorm(x.org)+' '+qNorm(x.location)+' ',body=qNorm(x.desc).slice(0,4000);
  let score=0;
  for(const g of pq.inc){const t=g.some(v=>hasTerm(ti,v))?3:g.some(v=>hasTerm(org,v))?2:g.some(v=>hasTerm(body,v))?1:0;if(!t)return 0;score+=t;}
  for(const g of pq.exc)if(g.some(v=>hasTerm(ti,v)||hasTerm(org,v)))return 0;
  return score;
}

const TOPICS=[['ai','AI and machine learning',['ml','xai','cv','dlfw','mllib','mlops'],/\b(machine learning|ml|ai|ia|deep learning|computer vision|data scien)/],
  ['llm','LLMs and NLP',['llm','nlp','ir','llmfw'],/\b(llm|nlp|language model|genai|generative|rag|search|retrieval)/],
  ['data','Data',['data','db','nosql'],/\b(data|donnees|analytics|bi|etl)\b/],
  ['soft','Software and backend',['backend','api','pyweb','jvmweb','jsweb','phpweb','front','devops','cloud'],/\b(software|logiciel|developer|developpeur|backend|full.?stack|devops|cloud)/],
  ['res','Research and PhD',['research','opt'],/\b(phd|doctora|these|thesis|research|recherche|postdoc|scientist)/]];
function topicsOf(x){
  if(x._topics)return x._topics;
  const t=qNorm(x.title),fams=SC?SC.skillsIn((x.title||'')+' . '+(x.desc||'').slice(0,3000)).map(k=>SC.FAMILY[k]):[];

async function runSaved(){
  const box=$('#ssBox');if(!box)return;
  if(!state.searches.length){box.innerHTML='<p class="hint" style="margin:0">Search for jobs below, then choose "Save this search".</p>';return;}
  if(!caps.online){box.innerHTML='<p class="hint" style="margin:0">Saved searches run in the deployed app once you are signed in.</p>';return;}
  const first=!state.seenAt;
  box.innerHTML=state.searches.map(s=>{const c=cById(s.c)||{};return `<div class="ssh"><span>${esc(s.search)} · ${c.flag||''} ${esc(s.location)}${s.type?' · '+esc(s.type):''}</span><button class="btn sm" data-ssdel="${esc(s.id)}">Remove</button></div><div id="ss-${esc(s.id)}" class="hint">Searching…</div>`;}).join('');
  for(const s of state.searches){
    const el=document.getElementById('ss-'+s.id);if(!el)return;
    try{
      const srcs=(s.sources&&s.sources.length?s.sources.filter(id=>caps.sources[id]):pickSources(s)).filter(id=>!PY.includes(id));
      const key=JSON.stringify([s.search,s.c,s.location,s.type,srcs]);
      let m=memo[s.id];
      if(!m||Date.now()-m.t>10*60*1000||m.key!==key){
        const r=await searchJobs(s,srcs);
        r.jobs.forEach(j=>{j.isNew=!first&&!state.seen[j.id];});
        m=memo[s.id]={t:Date.now(),key,jobs:r.jobs};
        r.jobs.forEach(j=>{state.seen[j.id]=Date.now();});
      }
      const e2=document.getElementById('ss-'+s.id);if(!e2)return;
      e2.className='';e2.innerHTML=m.jobs.length?m.jobs.slice(0,8).map(jobCard).join(''):'<span class="hint">No listings right now.</span>';

function loadPdf(){
  if(pdfLib)return pdfLib;
  pdfLib=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(window.pdfjsLib);};s.onerror=()=>{pdfLib=null;ko(new Error('Could not load the PDF reader.'));};document.head.appendChild(s);});
  return pdfLib;

async function fileText(f){
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
    const lib=await loadPdf();const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
    // Keep line breaks: a new line whenever the text jumps down the page, so sections and dates stay apart.
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let lastY=null;
      for(const t of tc.items){const y=t.transform?Math.round(t.transform[5]):null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2)out+='\n';else if(out&&!out.endsWith(' ')&&!out.endsWith('\n'))out+=' ';out+=t.str;lastY=y;}
      out+='\n';}
    return out;
  }
  return f.text();
}

const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

const daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
// Recruitment pattern from a list of [day, kind]: months, weekdays, posting rhythm and the next likely wave.
function hireStats(entries){
  const days=entries.map(e=>e[0]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')).sort();
  if(!days.length)return null;
  const byMonth={},byDow=[0,0,0,0,0,0,0],byKind={};
  // Months count every offer; weekdays, rhythm and trends only use real dates (posted, or first seen live by a
  // collector run), not offers seeded from before the log existed.
  const timed=entries.filter(e=>e[2]!=='b'&&/^\d{4}-\d{2}-\d{2}$/.test(e[0]||'')),tdays=timed.map(e=>e[0]).sort();
  entries.forEach(([d,k])=>{if(!d)return;byMonth[d.slice(0,7)]=(byMonth[d.slice(0,7)]||0)+1;byKind[k||'job']=(byKind[k||'job']||0)+1;});
  timed.forEach(([d])=>{byDow[dayIdx(d)]++;});
  const uniq=[...new Set(tdays)],gaps=uniq.slice(1).map((d,i)=>daysBetween(uniq[i],d)).filter(g=>g>0).sort((a,b)=>a-b);
  const median=gaps.length?gaps[Math.floor(gaps.length/2)]:null;
  const mean=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:0,sd=gaps.length?Math.sqrt(gaps.reduce((a,g)=>a+(g-mean)**2,0)/gaps.length):0;
  const regular=gaps.length>=2&&median>=3&&mean>0&&sd/mean<0.8;
  const last=days.at(-1),todayIso=today();
  const next=regular?new Date(Date.parse(uniq.at(-1))+median*864e5).toISOString().slice(0,10):null;
  const in30=tdays.filter(d=>daysBetween(d,todayIso)<=30).length,prev30=tdays.filter(d=>{const g=daysBetween(d,todayIso);return g>30&&g<=60;}).length;
  const topDow=byDow.indexOf(Math.max(...byDow)),avgDow=tdays.length/7;
  return {n:days.length,first:days[0],last,byMonth,byDow,byKind,median,regular,next,in30,prev30,postingDays:uniq.length,
    topDow:byDow[topDow]>=3&&byDow[topDow]>=avgDow*1.3?topDow:null,timedN:tdays.length,peakMonths:Object.entries(byMonth).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([m])=>m)};
}

  return `<div class="hbars">${rows.map(([l,v,x])=>`<div class="hrow" tabindex="0" data-tip="${esc(tip(l,v,x))}"><span class="hl">${esc(l)}</span><span class="ht"><b class="yours" style="width:${max?Math.max(v?3:0,Math.round(v/max*100)):0}%"></b></span><span class="hv">${v}</span></div>`).join('')}</div>`;
}
function hiringPeriodsHtml(h){
  const all=[];(h.companies||[]).forEach(([,,e])=>e.forEach(x=>all.push(x)));
  const st=hireStats(all);if(!st)return '';
  const months=Object.keys(st.byMonth).sort().slice(-12),mMax=Math.max(...months.map(m=>st.byMonth[m]));
  const kindsIn=m=>{const j=all.filter(([d,k])=>d&&d.startsWith(m)&&k!=='phd').length;return `${j} jobs, ${st.byMonth[m]-j} PhD`;};
  const dMax=Math.max(...st.byDow),sumD=st.byDow.reduce((a,b)=>a+b,0);
  const spanDays=daysBetween(st.first,today());
  const cos=(h.companies||[]).map(([key,name,e])=>({key,name,st:hireStats(e)})).filter(c=>c.st&&c.st.n>=3).sort((a,b)=>b.st.n-a.st.n||(b.st.last>a.st.last?1:-1)).slice(0,15);
  const busiest=months.reduce((a,m)=>st.byMonth[m]>st.byMonth[a]?m:a,months[0]);
  return `<h2 class="sec market">Hiring periods</h2>
    <p class="hint">${st.n} offers from ${(h.companies||[]).length} companies over the last ${spanDays} days. Months before the log started (October 2026) only count offers that were still listed then, so they are under-counted; the picture sharpens with every collector run.${months.length>=3?` Busiest month so far: ${esc(monthLabel(busiest))}.`:''}</p>
    <div class="charts">
      <div class="panel"><h2>Offers per month</h2><p class="hint">When the offers were posted, across every source.</p>
        ${hbarsChart(months.map(m=>[monthLabel(m),st.byMonth[m],m]),mMax,(l,v,m)=>`${l}: ${v} offers (${kindsIn(m)})`)}
        ${chartTable(['Month','Offers','Jobs','PhD'],months.map(m=>{const j=all.filter(([d,k])=>d&&d.startsWith(m)&&k!=='phd').length;return [monthLabel(m),st.byMonth[m],j,st.byMonth[m]-j];}))}</div>
      <div class="panel"><h2>Offers by weekday</h2><p class="hint">${st.topDow!=null?`Most offers appear on ${DAY_NAMES[st.topDow]}s: check the boards that day.`:'No single day stands out yet.'} From ${st.timedN} offers with a real date.</p>
        ${hbarsChart(DAY_NAMES.map((d,i)=>[d,st.byDow[i]]),dMax,(l,v)=>`${l}: ${v} offers (${sumD?Math.round(v/sumD*100):0}%)`)}
        ${chartTable(['Weekday','Offers','Share'],DAY_NAMES.map((d,i)=>[d,st.byDow[i],(sumD?Math.round(st.byDow[i]/sumD*100):0)+'%']))}</div>
    </div>
    ${cos.length?`<h2 class="sec">Companies that recruit most often</h2>
    <div class="offers hp"><div class="thead" style="grid-template-columns:minmax(0,1fr) repeat(var(--hpc,5),var(--hpw,104px))"><span>Company</span><span>Offers</span><span>Last 30 days</span><span class="hpx">Posts every</span><span class="hpx">Last offer</span><span>Next likely</span></div>
    ${cos.map(c=>`<div class="offer" style="grid-template-columns:minmax(0,1fr) repeat(var(--hpc,5),var(--hpw,104px));align-items:center"><h3>${coLink(c.name)}${c.st.topDow!=null?` <span class="xp">${DAY_NAMES[c.st.topDow].slice(0,3)}</span>`:''}</h3>
      <span class="hv" style="text-align:left">${c.st.n}</span><span class="hv" style="text-align:left">${c.st.in30}${c.st.in30>c.st.prev30?' ↑':c.st.in30<c.st.prev30?' ↓':''}</span>
      <span class="hv hpx" style="text-align:left">${c.st.median?`~${c.st.median} d`:'–'}</span><span class="hv hpx" style="text-align:left">${esc(rel(c.st.last))}</span><span class="hv" style="text-align:left">${esc(nextLabel(c.st))}</span></div>`).join('')}</div>
    <p class="hint" style="margin-top:10px">"Posts every" is the usual gap between days with a new offer; "Next likely" appears only when that rhythm is regular. ↑ ↓ compare the last 30 days with the 30 before.</p>`:''}`;
}
function hiringPatternHtml(name,h){
  const c=(h.companies||[]).find(([key])=>key===coNorm(name));
  const st=c?hireStats(c[2]):null;
  if(!st)return `<p class="hint" style="margin:0">No offers from ${esc(name)} in the hiring log yet. It fills with every collector run.</p>`;
  const months=Object.keys(st.byMonth).sort().slice(-12),mMax=Math.max(...months.map(m=>st.byMonth[m]));
  const facts=[`<b>${st.n}</b> offer${st.n===1?'':'s'} over the last ${Math.max(1,daysBetween(st.first,today()))} days`,`last ${esc(rel(st.last))}`,
    st.median?`a new offer every <b>~${st.median} days</b>`:'',st.topDow!=null?`usually on <b>${DAY_NAMES[st.topDow]}s</b>`:'',
    st.peakMonths.length&&months.length>=3?`busiest in ${st.peakMonths.map(monthLabel).join(' and ')}`:'',st.next?`next wave likely <b>${esc(nextLabel(st).toLowerCase())}</b>`:''].filter(Boolean);
  return `<p style="margin:0 0 12px">${facts.join(' · ')}.</p>${hbarsChart(months.map(m=>[monthLabel(m),st.byMonth[m]]),mMax,(l,v)=>`${l}: ${v} offers from ${name}`)}`;
}
// The Companies pages refresh themselves: every 10 minutes while open, and when you come back to the tab.
function refreshCompanies(maxAge){
