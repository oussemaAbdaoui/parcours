<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#10201C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Visual language after shadcn/ui (MIT): neutral zinc scale, 1px borders, 8px radius, compact type. */
@font-face{font-family:"Twemoji Country Flags";unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E0063,U+E0065,U+E0067,U+E006C,U+E006E,U+E0073-E0074,U+E0077,U+E007F;src:url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/dist/TwemojiCountryFlags.woff2") format("woff2");font-display:swap}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#ffffff; --surface-2:#fafafa; --soft:#f4f4f5; --ink:#09090b; --muted:#71717a; --line:#e4e4e7; --line-2:#f0f0f2; --ring:#a1a1aa;
  --job:#0d9488; --master:#6366f1; --phd:#db2777;
  --job-t:#f0fdfa; --master-t:#eef2ff; --phd-t:#fdf2f8;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --hi:#15803d; --hi-t:#f0fdf4; --mid:#b45309; --mid-t:#fffbeb; --lo:#b91c1c; --lo-t:#fef2f2;
  --c-yours:#2a78d6; --c-gap:#eb6834; --b-strong:#104281; --b-fair:#2a78d6; --b-weak:#86b6ef;
  --accent:var(--job); --tint:var(--job-t);
  --display:'Geist','Twemoji Country Flags',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Geist','Twemoji Country Flags',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#09090b; --surface-2:#0c0c0e; --soft:#18181b; --ink:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-2:#1c1c1f; --ring:#52525b;
  --job:#2dd4bf; --master:#818cf8; --phd:#f472b6; --job-t:#0b2522; --master-t:#16183a; --phd-t:#2a0f1f;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --hi:#4ade80; --hi-t:#0c2415; --mid:#fbbf24; --mid-t:#2a1f07; --lo:#f87171; --lo-t:#2c1010;
  --c-yours:#3987e5; --c-gap:#d95926; --b-strong:#86b6ef; --b-fair:#3987e5; --b-weak:#184f95;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#09090b; --surface-2:#0c0c0e; --soft:#18181b; --ink:#fafafa; --muted:#a1a1aa; --line:#27272a; --line-2:#1c1c1f; --ring:#52525b;
  --job:#2dd4bf; --master:#818cf8; --phd:#f472b6; --job-t:#0b2522; --master-t:#16183a; --phd-t:#2a0f1f;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --hi:#4ade80; --hi-t:#0c2415; --mid:#fbbf24; --mid-t:#2a1f07; --lo:#f87171; --lo-t:#2c1010;
  --c-yours:#3987e5; --c-gap:#d95926; --b-strong:#86b6ef; --b-fair:#3987e5; --b-weak:#184f95;
  --shadow:none; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(56px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}

/* ---------- frame: sidebar + top bar ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:12px;border-right:1px solid var(--line);background:var(--surface-2);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px;padding:8px;border-radius:var(--r);margin-bottom:6px}
.brand:hover{background:var(--soft)}
.brand .logo{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.2}
.navlab{font-size:12px;font-weight:500;color:var(--muted);padding:12px 8px 4px}
.tabs{display:flex;flex-direction:column;gap:1px}
.tabs a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:7px 8px;border-radius:6px;color:var(--ink);font-size:14px}
.tabs a svg{color:var(--muted)}
.tabs a:hover{background:var(--soft)}
.tabs a[aria-current="page"]{background:var(--soft);font-weight:500}
.tabs a[aria-current="page"] svg{color:var(--ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px;border-top:1px solid var(--line)}
.syncl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.syncl:not(:empty)::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ring)}
.syncl.on::before{background:var(--ok)}.syncl.err::before{background:var(--bad)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;height:56px;padding-inline:24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.topbar .where{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-width:0}
.topbar .where b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.theme{display:none}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-inline:24px;padding-block:24px 64px}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:7;flex-direction:row;align-items:center;gap:4px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{margin:0;padding:4px}.brand span,.navlab,.side-foot .syncl{display:none}
  .tabs{flex-direction:row}
  .tabs a{white-space:nowrap;padding:6px 10px}
  .side-foot{margin:0 0 0 auto;border:0;padding:0}
  .topbar{position:static;height:44px;padding-inline:16px}
  .wrap{padding-inline:16px;padding-block:16px 56px}
}

/* ---------- type ---------- */
h1{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.25;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0 0 2px;text-wrap:balance}
h3{text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.lab{font-size:13px;font-weight:500;display:block;margin-bottom:6px;color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.crumbs a{text-decoration:none;color:var(--muted)}.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs span{color:var(--ring)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);font-size:14px;font-weight:500;line-height:1;text-decoration:none;white-space:nowrap;box-shadow:var(--shadow);transition:background .12s}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 88%,var(--bg))}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=date],input[type=url],input[type=number],input[type=password],input[type=search],textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px;height:36px;font-size:14px;width:100%;box-shadow:var(--shadow)}
textarea{padding:8px 10px;height:auto;line-height:1.5;resize:vertical}
select{padding-right:28px}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ring);outline-offset:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar select{width:auto;height:32px;font-size:13px}
.toolbar input[type=search]{height:32px;max-width:280px;flex:1 1 220px;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.filters select{width:auto;height:32px;font-size:13px}
.sc{display:inline-flex;gap:6px;align-items:center;height:32px;border:1px dashed var(--line);border-radius:var(--r);padding:0 10px;font-size:13px;background:var(--surface);cursor:pointer}
.sc:has(input:checked){border-style:solid;background:var(--soft)}
.sc.off{opacity:.45;cursor:not-allowed}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
input[type=checkbox]{accent-color:var(--ink);width:14px;height:14px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel>h2+.hint{margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.two .panel{margin-bottom:0}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.demo{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13px}
.nudge{border:1px solid var(--line);background:var(--soft);border-radius:var(--r);padding:8px 12px;font-size:13px;margin:0 0 12px}
.nudge a{font-weight:500}
.empty{text-align:center;padding:40px 20px}
.empty p{color:var(--muted);max-width:46ch;margin:6px auto 18px}
.empty .row{justify-content:center}

/* ---------- stat cards (shadcn "card" with title, value, description) ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:16px}
.stat{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow)}
.stat span{order:0;font-size:13px;font-weight:500;color:var(--ink)}
.stat b{order:1;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat small{order:2;font-size:12px;color:var(--muted)}

/* ---------- charts ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chart{overflow-x:auto}
.chart svg{display:block;min-width:600px;width:100%;height:auto}
svg .t{fill:var(--muted);font-size:12px;font-family:var(--body)}
svg .tb{fill:var(--ink);font-size:12.5px;font-weight:500;font-family:var(--body)}
svg .grid{stroke:var(--line-2);stroke-width:1}
svg .today{stroke:var(--ring);stroke-width:1;stroke-dasharray:3 3}
svg .dot{cursor:pointer}
svg .dot:hover{stroke:var(--ink);stroke-width:2}
.frow{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.frow .tr{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;position:relative}
.frow .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:4px}
.frow .tr i.b{background:var(--ink)}
.frow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.frow .v b{color:var(--ink);font-weight:500}
.frow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{display:grid;grid-template-columns:130px repeat(3,1fr);gap:0;min-width:520px}
.mxw{overflow-x:auto}
.mx>*{padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:1px solid var(--line-2)}
.mx .h{border-top:0;font-size:12px;font-weight:500;color:var(--muted)}
.mx .cn{align-items:flex-start;flex-direction:row;gap:8px;font-weight:500;font-size:14px;justify-content:flex-start}
.mx a{text-decoration:none;border-radius:6px}
.mx a:hover{background:var(--soft)}
.mx .c{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:var(--bg);font-weight:600;font-size:12px}
.mx .z{color:var(--line);font-size:20px;line-height:1}
.mx small{font-size:11px;color:var(--muted)}
.insight{white-space:pre-wrap;font-size:14px;margin-top:12px;max-width:70ch}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.charts .panel{margin:0}
.charts .chart-skills{grid-row:span 2}
@media(max-width:900px){.charts{grid-template-columns:1fr}.charts .chart-skills{grid-row:auto}}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.yours,.hbars b.yours{background:var(--c-yours)}.sw.gap,.hbars b.gap{background:var(--c-gap)}.hbars b.ns{background:var(--line)}
.sw.b-strong,.stack b.b-strong{background:var(--b-strong)}.sw.b-fair,.stack b.b-fair{background:var(--b-fair)}.sw.b-weak,.stack b.b-weak{background:var(--b-weak)}
.hbars{display:grid;gap:7px}
.hrow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13px;border-radius:6px;outline-offset:3px}
.hrow .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hl em{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 5px;margin-left:4px}
.hrow.me .hl{font-weight:600}
.ht{height:8px;background:var(--soft);border-radius:0 4px 4px 0;overflow:hidden}
.ht b{display:block;height:100%;border-radius:0 4px 4px 0}
.hv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hv small{font-family:var(--body);color:var(--muted);font-size:11px;margin-left:5px}
.stacks{display:grid;gap:12px}
.srow{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.srow small{font-family:var(--mono);color:var(--muted);font-size:11px;margin-left:4px}
.stack{display:flex;gap:2px;height:22px}
.stack b{display:flex;align-items:center;justify-content:center;min-width:4px;color:#fff;font:600 11px var(--mono);border-radius:2px;outline-offset:2px}
.stack b:first-child{border-radius:4px 2px 2px 4px}.stack b:last-child{border-radius:2px 4px 4px 2px}
.stack b.b-weak{color:#09090b}
:root[data-theme="dark"] .stack b.b-strong{color:#09090b}:root[data-theme="dark"] .stack b.b-weak{color:#fafafa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stack b.b-strong{color:#09090b}:root:not([data-theme="light"]) .stack b.b-weak{color:#fafafa}}
.ctab{margin-top:10px;font-size:12px}
.ctab summary{cursor:pointer;color:var(--muted)}
.ctab .tbl{overflow-x:auto;margin-top:6px}
.ctab table{border-collapse:collapse;width:100%;font-size:12.5px}
.ctab th,.ctab td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line-2)}
.ctab td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:50;max-width:280px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
[data-tip]:focus-visible{outline:2px solid var(--ring)}

/* ---------- badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:12px;font-weight:500;color:var(--ink);background:var(--surface)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.new{display:inline-flex;align-items:center;height:18px;background:var(--ink);color:var(--bg);border-radius:5px;padding:0 6px;font-size:11px;font-weight:600;vertical-align:1px}
.urgent{display:inline-flex;align-items:center;height:18px;border:1px solid color-mix(in srgb,var(--lo) 35%,transparent);background:var(--lo-t);color:var(--lo);border-radius:5px;padding:0 6px;font-size:11px;font-weight:600;vertical-align:1px}
.xp{display:inline-flex;align-items:center;height:20px;margin-left:6px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:500;font-family:var(--mono);color:var(--ink);background:var(--soft)}
.src{display:inline-flex;align-items:center;height:18px;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px;color:var(--muted);margin-left:4px}
.conf{font-size:11px;font-weight:500;border-radius:5px;padding:0 6px;border:1px solid var(--line);color:var(--muted)}
.conf.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.score{display:inline-flex;align-items:center;justify-content:center;width:40px;height:26px;border-radius:6px;font-family:var(--mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.score.s-hi{background:var(--hi-t);color:var(--hi);border-color:color-mix(in srgb,var(--hi) 30%,transparent)}
.score.s-mid{background:var(--mid-t);color:var(--mid);border-color:color-mix(in srgb,var(--mid) 30%,transparent)}
.score.s-lo{background:var(--lo-t);color:var(--lo);border-color:color-mix(in srgb,var(--lo) 30%,transparent)}
.score.weak{border-style:dashed}

/* ---------- offers: data table ---------- */
.offers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.offers .thead{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:0 14px;height:40px;align-items:center;font-size:12.5px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.offer{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line-2)}
.offer:first-child,.offers .thead+.offer{border-top:0}
.offer:hover{background:var(--surface-2)}
.offer:not(:has(.score)){grid-template-columns:minmax(0,1fr) auto}
.offer h3{margin:0;font-size:14px;font-weight:500;line-height:1.4}
.offer h3 a{text-decoration:none}
.offer h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.offer .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.offer .meta b{color:var(--ink);font-weight:500}
.offer .score{margin-top:1px}
.oa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.offers.compact{border:0;border-radius:0;background:none}
.offers.compact .offer{grid-template-columns:56px minmax(0,1fr);padding:10px 0}
.offers.compact .offer:hover{background:none}
@media(max-width:640px){.offer{grid-template-columns:48px minmax(0,1fr)}.oa{grid-column:2;justify-content:flex-start;margin-top:6px}.offers .thead{display:none}}
details.why,details.desc{margin-top:6px;display:inline-block;vertical-align:top;margin-right:14px}
details[open].why,details[open].desc{display:block;margin-right:0}
details.why summary,details.desc summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:5px}
details.why summary::-webkit-details-marker,details.desc summary::-webkit-details-marker{display:none}
details.why summary::before,details.desc summary::before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open].why summary::before,details[open].desc summary::before{transform:rotate(90deg)}
details.why summary:hover,details.desc summary:hover{color:var(--ink)}
.bars{display:grid;gap:6px;margin-top:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.bar{display:grid;grid-template-columns:128px 90px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.bar span{font-weight:500}
.bar span small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px}
.bar i{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar em{font-style:normal;color:var(--muted);overflow-wrap:anywhere}
.bar.unk{opacity:.5}
@media(max-width:560px){.bar{grid-template-columns:1fr 70px}.bar em{grid-column:1 / -1}}
.an{font-size:13px;color:var(--muted);margin:6px 0 0;white-space:pre-wrap}

/* ---------- rows (radar, search results) ---------- */
.job,.rad{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;border-top:1px solid var(--line-2);padding:12px 0}
.job:first-child,.rad:first-child{border-top:0}
.job h3,.rad h3{margin:0;font-size:14px;font-weight:500}
.job h3 a,.rad h3 a{text-decoration:none}
.job h3 a:hover,.rad h3 a:hover{text-decoration:underline}
.job .meta,.rad .meta{font-size:12.5px;color:var(--muted)}
.rad p{grid-column:1;margin:0;font-size:13px;color:var(--muted)}
.ssh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px;font-weight:500;font-size:14px}
.ssh:first-child{margin-top:0}
.fchips{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.fchips button{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 12px;font-size:13px}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- category cards (explore, opportunities) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);transition:border-color .12s,background .12s}
.card:hover{border-color:var(--ring)}
.card .big{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card .flag{font-size:22px;line-height:1;margin-bottom:6px}
.card .meta{font-size:13px;color:var(--muted)}
.card .meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.card.dom .big{display:flex;align-items:center;gap:8px}
.card.dom .big::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card.dom p{margin:0;font-size:13px;color:var(--muted)}
h2.sec{font-size:13px;font-weight:500;color:var(--muted);margin:28px 0 10px;letter-spacing:0;text-transform:none}
h2.sec:first-of-type{margin-top:4px}
h2.sec.market{margin-top:28px}
.best{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);font-size:13px;line-height:1.35}
.best small{display:block;color:var(--muted);font-size:12px}
.best span:last-child{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.tool .big{font-size:15px}
.card.tool p{margin:0;font-size:13px;color:var(--muted)}
.angle{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}
@media(max-width:640px){.angle{grid-template-columns:1fr}}
.angle div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px}
.angle strong{display:block;font-size:12px;font-weight:500;margin-bottom:2px}
.angle .e strong{color:var(--ok)}.angle .g strong{color:var(--warn)}
p.tip{font-size:13px;color:var(--muted);margin:0 0 18px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);position:static;max-width:none;box-shadow:none;pointer-events:auto}
.plist{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.plat{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 16px;align-items:center;border-top:1px solid var(--line-2)}
.plat:first-child{border-top:0}
.plat h3{margin:0;font-size:14px;font-weight:500}
.plat h3 a{text-decoration:none}.plat h3 a:hover{text-decoration:underline}
.kind{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.plat p{grid-column:1;margin:0;font-size:13px;color:var(--muted)}
.plat .log{font-size:12px;color:var(--muted)}
.prio{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.prio i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.prio i.on{background:var(--ink)}
.status{grid-column:2;grid-row:1 / span 3;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 10px;font-size:12.5px;min-width:96px;text-align:center}
.status[data-s="exploring"]{background:var(--soft)}
.status[data-s="applied"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.status[data-s="skip"]{text-decoration:line-through;color:var(--muted)}
.plat.skipped{opacity:.55}
.notes textarea{min-height:100px}

/* ---------- applications: board + list ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(176px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;transition:background .12s,border-color .12s}
.col.over{background:var(--soft);border-color:var(--ring)}
.colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-size:13px;font-weight:500}
.colh span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.kcards{display:flex;flex-direction:column;gap:8px}
.kcard{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:grab}
.kcard:hover{border-color:var(--ring)}
.kcard.dragging{opacity:.4}
.kcard b{display:block;font-size:13.5px;font-weight:500}
.kcard small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.kcard .kmeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.kcard .kres{margin-left:auto;font-size:11px;font-weight:500;border-radius:5px;padding:0 6px;border:1px solid var(--line)}
.kcard .kres.r-rejected{color:var(--lo);background:var(--lo-t)}.kcard .kres.r-accepted{color:var(--hi);background:var(--hi-t)}
.kempty{font-size:12px;color:var(--muted);text-align:center;padding:14px 4px;border:1px dashed var(--line);border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--soft)}
.seg button{height:28px;border:0;background:transparent;border-radius:6px;padding:0 10px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.app{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.app h3{margin:0;font-size:14px;font-weight:500}
.app h3 small{font-weight:400;color:var(--muted);font-size:13px}
.app .meta{font-size:12.5px;color:var(--muted)}
.app .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1 / -1}
.app .ctl select{width:auto;height:30px;font-size:12.5px}
.app .an{grid-column:1 / -1}
.imp{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;background:var(--surface)}
.imp textarea{min-height:130px;margin:8px 0}
.cand{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line-2);font-size:13px}
.cand b{font-size:14px;font-weight:500}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}

/* ---------- profile ---------- */
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{height:28px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 10px;font-size:12.5px;color:var(--muted)}
.skill:hover{color:var(--ink);background:var(--soft)}
.skill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px 22px}
.fam .lab{margin-bottom:6px;color:var(--muted);font-weight:500;font-size:12px}
.found{margin-top:12px;font-size:13px;border:1px solid var(--line);background:var(--soft);border-radius:var(--r);padding:0 14px;line-height:1.55}
.found:not(:empty){padding:10px 14px}
.order{list-style:none;margin:0;padding:0;counter-reset:o;display:flex;flex-direction:column;gap:6px}
.order li{counter-increment:o;display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r)}
.order li::before{content:counter(o);font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.order .btn.sm{height:26px;padding:0 8px}

/* ---------- notes ---------- */
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;display:grid;gap:8px}
.note .top2{display:flex;gap:8px;flex-wrap:wrap}
.note input[type=text]{font-weight:500;flex:1;min-width:160px}
.note select{width:auto}
.note textarea{min-height:110px}
.note small{color:var(--muted);font-size:12px}
.rn{display:block;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-decoration:none;font-size:13px}
.rn:hover{border-color:var(--ring)}
.rn b{display:block;font-size:14px;font-weight:500}
.rn span{color:var(--muted);white-space:pre-wrap}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 16px 48px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dl{padding:24px;display:grid;gap:14px}
.dl h2{margin:0;font-size:18px}
.dl label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.dl textarea{min-height:70px}
.dl .acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.foot button{border:0;background:none;text-decoration:underline;color:var(--muted);padding:0;font-size:12px}
.foot button:hover{color:var(--ink)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  </nav>

</div>
</div>
</div>

<dialog id="loginDlg" aria-labelledby="loginT">
  <div class="dl"><h2 id="loginT">Sign in</h2><p class="hint" id="loginMsg" style="margin:0"></p>
    <input type="password" id="loginPw" autocomplete="current-password" aria-label="Password">
    <div class="acts"><span></span><button class="btn primary" type="button" id="loginGo">Continue</button></div></div>
</dialog>

<dialog id="dlg" aria-labelledby="dlgT">

async function api(path,opts={}){

      else if((state.updatedAt||0)>(remote.updatedAt||0)){dirty=true;flush();}

    }else if(hasData(state)){dirty=true;flush();}

  }catch(e){setSync('error');}
}
function parseJsonLoose(t){
  const tryP=x=>{try{return {v:JSON.parse(x)};}catch(e){return null;}};
  let r=tryP(t.trim());if(r)return r.v;
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){r=tryP(f[1].trim());if(r)return r.v;}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(a>=0&&b>a){r=tryP(t.slice(a,b+1));if(r)return r.v;}
  throw {code:'invalid_json',message:'Could not read the answer.',text:t};
}
function makeSample(){
  const f=async(prompt,opts={})=>{
    const j=await api('/api/ai',{method:'POST',body:JSON.stringify({prompt,tier:opts.modelTier})});
    if(opts.onText)opts.onText({text:j.text,delta:j.text});
    return {text:j.text};
  };
  f.json=async(prompt,opts)=>parseJsonLoose((await f(prompt,opts)).text);
  return f;
}
function errText(e,map,def){
  if(e&&e.code&&map[e.code])return map[e.code];
  if(e&&e.message&&(String(e.code).startsWith('http')||e.code==='network'||e.code==='unauthorized'))return e.message;
  return def;
}

/* metrics */
function metrics(apps){
  const n=apps.length;
  const replied=apps.filter(a=>a.stage!=='applied'||a.result==='rejected').length;
  const inter=apps.filter(a=>a.stage==='interview'||a.stage==='offer').length;
  const offers=apps.filter(a=>a.stage==='offer').length;
  const waiting=apps.filter(a=>a.stage==='applied'&&a.result==='open'&&daysAgo(a.date)>21).length;
  return {n,replied,inter,offers,waiting};
}

function timelineSvg(apps){
  const rows=COUNTRIES.filter(c=>apps.some(a=>a.c===c.id));
  const W=760,L=112,R=22,T=14,RH=48,B=30,H=T+rows.length*RH+B;
  const now=Date.now();
  let min=Math.min(...apps.map(a=>tms(a.date)),now-56*DAY)-3*DAY;
  const max=now+4*DAY;
  const x=ms=>L+(ms-min)/(max-min)*(W-L-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of applications by country">`;
  rows.forEach((c,i)=>{const y=T+i*RH+RH/2;
    s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="tb" x="0" y="${y+4}">${c.flag} ${esc(c.name.length>11?c.name.slice(0,10)+'…':c.name)}</text>`;});
  const d0=new Date(min);let cur=new Date(d0.getFullYear(),d0.getMonth()+1,1);
  while(cur.getTime()<max){const px=x(cur.getTime());
    s+=`<line class="grid" x1="${px}" x2="${px}" y1="${T}" y2="${H-B}"/><text class="t" x="${px+4}" y="${H-10}">${cur.toLocaleDateString('en',{month:'short'})}</text>`;
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  s+=`<line class="today" x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H-B}"/><text class="t" x="${x(now)-14}" y="${H-10}">Today</text>`;
  const seen={};const rad={applied:5,replied:6.5,interview:8,offer:10};
  [...apps].sort((a,b)=>tms(a.date)-tms(b.date)).forEach(a=>{
    const ri=rows.findIndex(c=>c.id===a.c);if(ri<0)return;
    const key=a.c+'|'+a.date;const k=seen[key]=(seen[key]||0)+1;const j=k-1;
    const cx=x(tms(a.date))+Math.floor(j/3)*10, cy=T+ri*RH+RH/2+((j%3)-1)*12;
    const col=`var(${(DOM[a.d]||DOM.job).color})`;
    const rej=a.result==='rejected';
    const fill=rej?'var(--surface)':col;
    const op=a.result==='withdrawn'?.35:1;
    const ring=a.result==='accepted'?'stroke:var(--ink);stroke-width:2.5':`stroke:${col};stroke-width:2`;
    s+=`<circle class="dot" data-id="${esc(a.id)}" cx="${cx.toFixed(1)}" cy="${cy}" r="${rad[a.stage]||5}" style="fill:${fill};${ring}" opacity="${op}" tabindex="0"><title>${esc(a.org)}${a.role?', '+esc(a.role):''} (${STAGE_LABEL[a.stage]}, ${RES_LABEL[a.result]}, ${a.date})</title></circle>`;
  });
  return s+'</svg>';
}
function funnel(m){
  const steps=[['Applied',m.n],['Got a reply',m.replied],['Interview',m.inter],['Offer',m.offers]];
  return steps.map(([l,v])=>`<div class="frow"><span class="nm">${l}</span><span class="tr"><i style="width:${m.n?Math.round(v/m.n*100):0}%"></i></span><span class="v"><b>${v}</b> ${pct(v,m.n)}</span></div>`).join('');
}
function platforms(apps){
  const map={};
  apps.forEach(a=>{const k=a.p||'Other / direct';(map[k]=map[k]||{n:0,r:0});map[k].n++;if(gotReply(a))map[k].r++;});
  const list=Object.entries(map).sort((a,b)=>b[1].n-a[1].n).slice(0,8);const mx=list[0][1].n;
  return list.map(([k,v])=>`<div class="frow"><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="tr"><i style="width:${Math.round(v.n/mx*100)}%;opacity:.35"></i><i class="b" style="width:${Math.round(v.r/mx*100)}%"></i></span><span class="v"><b>${v.n}</b> · ${pct(v.r,v.n)}</span></div>`).join('');
}
function matrix(apps){
  let h=`<div class="mxw"><div class="mx"><div class="h"></div>${Object.values(DOM).map(v=>`<div class="h">${v.label}</div>`).join('')}`;
  COUNTRIES.forEach(c=>{

    });
  });
  return h+'</div></div>';
}

let gmItems=[], gmIgnored=[], gmNote=null;
const normOrg=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function matchApp(org,role){
  const o=normOrg(org),r=normOrg(role);if(o.length<2)return null;
  const hits=state.apps.filter(a=>{const x=normOrg(a.org);return x&&(x===o||(Math.min(x.length,o.length)>=4&&(x.includes(o)||o.includes(x))));});
  const roleHit=a=>r&&normOrg(a.role)===r?1:0;
  return hits.sort((a,b)=>roleHit(b)-roleHit(a)||tms(b.date)-tms(a.date))[0]||null;
}
function gmPlan(x){
  const e={c:cById(x.c)?x.c:'fr',d:DOM[x.d]?x.d:'job',stage:STAGES.includes(x.stage)?x.stage:'applied',result:RES.includes(x.result)?x.result:'open'};
  if(x.kind==='opportunity')return Object.assign(e,{act:'save',text:state.saved.some(s=>s.id==='gm'+x.id)?'Already in saved jobs':'Save to saved jobs',on:!state.saved.some(s=>s.id==='gm'+x.id)});
  const a=matchApp(x.org,x.role);
  if(!a)return Object.assign(e,{act:'new',text:`Add as new application (${STAGE_LABEL[e.stage]}, ${RES_LABEL[e.result]})`,on:true});
  const stage=STAGES.indexOf(e.stage)>STAGES.indexOf(a.stage)?e.stage:a.stage,result=e.result!=='open'?e.result:a.result;
  const ch=[stage!==a.stage?`${STAGE_LABEL[a.stage]} → ${STAGE_LABEL[stage]}`:'',result!==a.result?`${RES_LABEL[a.result]} → ${RES_LABEL[result]}`:''].filter(Boolean);
  return Object.assign(e,{act:'update',app:a,stage,result,text:ch.length?`Update ${a.org}${a.role?' ('+a.role+')':''}: ${ch.join(', ')}`:`Matches ${a.org}, already up to date`,on:ch.length>0});
}

async function gmScan(){
  const msg=$('#gmMsg'),res=$('#gmRes'),btn=$('#gmGo');
  btn.disabled=true;msg.textContent='Reading your emails… this can take up to a minute.';res.innerHTML='';
  try{
    const r=await api('/api/gmail',{method:'POST',body:JSON.stringify({action:'scan',days:+$('#gmDays').value,seen:state.mailSeen||[],countries:COUNTRIES.map(c=>c.id+'='+c.name).join(', ')})});
    const seen=new Set(state.mailSeen||[]),fresh=r.emails.filter(x=>!seen.has(x.id));
    gmItems=fresh.filter(x=>x.kind!=='ignore').map(x=>Object.assign({},x,{plan:gmPlan(x)}));gmIgnored=fresh.filter(x=>x.kind==='ignore').map(x=>x.id);
    msg.textContent=r.scanned?`${r.scanned} new email${r.scanned===1?'':'s'} read${r.skipped?`, ${r.skipped} already seen`:''}.${r.more?' More remain: scan again after applying.':''}`:`No new emails to read${r.skipped?` (${r.skipped} already seen)`:''}.`;
    gmRender();
  }catch(e){
    msg.textContent=errText(e,{},'Scan failed. Try again.');
    if(e.code==='http_409')gmStatus(e.message);

function gmRender(){
  const res=$('#gmRes');if(!res)return;
  if(!gmItems.length&&!gmIgnored.length){res.innerHTML='';return;}
  const G=[['Opportunities',x=>x.kind==='opportunity'],['Offers and acceptances',x=>x.plan.result==='accepted'||(x.plan.stage==='offer'&&x.plan.result!=='rejected')],

    py.length?call('/api/boards',py).catch(e=>({jobs:[],sources:Object.fromEntries(py.map(s=>[s,{ok:false,error:e.message||'Failed'}]))})):null]);

let pdfLib=null;
function loadPdf(){
  if(pdfLib)return pdfLib;
  pdfLib=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(window.pdfjsLib);};s.onerror=()=>{pdfLib=null;ko(new Error('Could not load the PDF reader.'));};document.head.appendChild(s);});
  return pdfLib;
}
async function fileText(f){
  if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
    const lib=await loadPdf();const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
    // Keep line breaks: a new line whenever the text jumps down the page, so sections and dates stay apart.
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let lastY=null;
      for(const t of tc.items){const y=t.transform?Math.round(t.transform[5]):null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2)out+='\n';else if(out&&!out.endsWith(' ')&&!out.endsWith('\n'))out+=' ';out+=t.str;lastY=y;}
      out+='\n';}
    return out;
  }
  return f.text();
}

  T.forEach(([c,d,p,org,role,ago,stage,result])=>s.apps.push({id:uid(),org,role,c,d,p,date:iso(Date.now()-ago*DAY),stage,result,link:'',notes:''}));
  return s;
}
function enterDemo(){real=state;state=demoState();demo=true;location.hash='#/';route();}
function exitDemo(){state=real||state;real=null;demo=false;route();}

/* events */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='new')openDlg({});
    else if(act==='import'){const b=$('#imp');if(b)b.hidden=!b.hidden;}
    else if(act==='gmail'){const b=$('#gm');if(b){b.hidden=!b.hidden;if(!b.hidden)gmStatus();}}
    else if(act==='csv')exportCsv();
    else if(act==='demo')enterDemo();
    else if(act==='exitdemo')exitDemo();
    return;}
  const js=e.target.closest('[data-jsave]');
  if(js){const j=jobReg[js.dataset.jsave];if(j&&!state.saved.some(x=>x.id===j.id)){state.saved.unshift({id:j.id,title:j.title,company:j.company,location:j.location,posted:j.posted,type:j.type,url:j.url,c:j.c,source:j.source});state.saved=state.saved.slice(0,60);save();js.disabled=true;js.textContent='Saved';renderSaved();}return;}
  const jl=e.target.closest('[data-jlog]');
  if(jl){const j=jobReg[jl.dataset.jlog];if(j)openDlg({org:j.company,role:j.title,c:j.c||'fr',d:'job',p:(SRC[j.source]||{}).label||'',link:safeUrl(j.url)});return;}
  const cs=e.target.closest('[data-cosave]');
  if(cs){const x=colData&&colData.items.find(i=>i.id===cs.dataset.cosave);if(x&&!state.saved.some(s=>s.id==='co'+x.id)){state.saved.unshift({id:'co'+x.id,title:x.title,company:x.org,location:x.location,posted:x.posted,type:x.type||'',url:x.url,c:x.c,source:x.source,kind:x.kind,deadline:x.deadline||'',desc:(x.desc||'').slice(0,1500),applicants:x.applicants,rating:x.company&&x.company.rating?x.company:null,exp:x.exp||null});state.saved=state.saved.slice(0,60);save();cs.disabled=true;renderSaved();}return;}
  const cl=e.target.closest('[data-colog]');
  if(cl){const x=colData&&colData.items.find(i=>i.id===cl.dataset.colog);if(x)openDlg({org:x.org||x.source,role:x.title,c:cById(x.c)?x.c:'fr',d:DOM[x.kind]?x.kind:'job',p:x.source,link:safeUrl(x.url)});return;}
  const ch=e.target.closest('[data-cohide]');
  if(ch){state.oppsHidden=[...(state.oppsHidden||[]),ch.dataset.cohide].slice(-2000);save();renderCollected();return;}
  const jd=e.target.closest('[data-jdel]');if(jd){state.saved=state.saved.filter(x=>x.id!==jd.dataset.jdel);save();renderSaved();return;}
  const sd=e.target.closest('[data-ssdel]');if(sd){state.searches=state.searches.filter(x=>x.id!==sd.dataset.ssdel);save();runSaved();return;}
  const fd=e.target.closest('[data-fdel]');if(fd){state.feeds=state.feeds.filter(x=>x.id!==fd.dataset.fdel);save();renderFeeds();return;}
  const rf=e.target.closest('[data-rf]');if(rf){radarFilter=rf.dataset.rf;renderRadar();return;}
  const rl=e.target.closest('[data-rlog]');
  if(rl){const x=((radar&&radar.items)||[]).find(i=>i.id===rl.dataset.rlog);if(x)openDlg({org:x.org,role:x.title,c:x.c,d:x.kind,p:'',link:safeUrl(x.url)});return;}
  const ed=e.target.closest('[data-edit]');if(ed){openDlg({},ed.dataset.edit);return;}
  const kc=e.target.closest('[data-card]');if(kc){openDlg({},kc.dataset.card);return;}
  const dot=e.target.closest('.dot');if(dot){openDlg({},dot.dataset.id);return;}
  const st=e.target.closest('.status');
  if(st){const k=st.dataset.k;state.status[k]=STATUS[(STATUS.indexOf(stat(k))+1)%STATUS.length];save();const y=scrollY;route();scrollTo(0,y);const n=document.querySelector(`.status[data-k="${k}"]`);if(n)n.focus();return;}
  if(e.target.id==='insBtn')analyse();
  const del=e.target.closest('[data-del]');
  if(del){if(confirm('Delete this note?')){state.journal=state.journal.filter(n=>n.id!==del.dataset.del);save();renderNotes();}}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('dot')){e.preventDefault();openDlg({},e.target.dataset.id);}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.stage||t.dataset.res){const id=t.dataset.stage||t.dataset.res;const a=state.apps.find(x=>x.id===id);if(a){if(t.dataset.stage)a.stage=t.value;else a.result=t.value;save();}}
  const n=t.closest&&t.closest('.note');
  if(n&&t.dataset.f==='c'){const o=state.journal.find(x=>x.id===n.dataset.n);if(o){o.c=t.value;save();}}
});
document.addEventListener('input',e=>{
  const t=e.target,n=t.closest&&t.closest('.note');
  if(n&&(t.dataset.f==='title'||t.dataset.f==='body')){const o=state.journal.find(x=>x.id===n.dataset.n);if(o){o[t.dataset.f]=t.value;save();}}
});

$('#fD').addEventListener('change',()=>fillPlatforms(''));

function notice(msg){const n=$('#notice');n.textContent=msg;n.hidden=false;}
function showLogin(){const d=$('#loginDlg');if(!d.open){$('#loginMsg').textContent=getPw()?'That password did not work. Try again.':'Enter the password you set as APP_PASSWORD in Vercel.';d.showModal();$('#loginPw').focus();}}
async function boot(){
  let p=null;
  try{p=await api('/api/ping');}
  catch(e){
    if(e.code==='unauthorized')return;
    caps.online=false;
    if(e.code==='http_503')notice(e.message);
    setSync('local');if(!demo)route();return;
  }
  caps={sources:p.sources||{},sync:!!p.sync,ai:!!p.ai,gmail:!!p.gmail,online:true};
  sample=caps.ai?makeSample():null;
  fetch('/radar.json').then(r=>r.ok?r.json():null).then(j=>{if(j){radar=j;renderRadar();}}).catch(()=>{});
  if(!demo)route();
  if(caps.sync)await pull();else setSync('local');
}
$('#loginGo').addEventListener('click',()=>{const v=$('#loginPw').value;if(!v)return;try{localStorage.setItem(PWKEY,v);}catch(e){}$('#loginPw').value='';$('#loginDlg').close();boot();});
$('#loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginGo').click();});
$('#exp').addEventListener('click',()=>downloads.save({filename:'parcours-backup.json',data:JSON.stringify(state,null,2)}));
$('#bkFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||!Array.isArray(p.apps))throw 0;
    if(confirm('Replace your current data with this backup?')){state=Object.assign(emptyState(),p);save();route();}}
  catch(x){alert('That file is not a valid Parcours backup.');}
  e.target.value='';
});
$('#bkImp').addEventListener('click',()=>$('#bkFile').click());
$('#signout').addEventListener('click',()=>{try{localStorage.removeItem(PWKEY);}catch(e){}location.reload();});
route();
boot();
