/* ---------- Notifications (installable app + Web Push) ---------- */
const swReady=('serviceWorker' in navigator)?navigator.serviceWorker.register('/sw.js').then(()=>navigator.serviceWorker.ready).catch(()=>null):Promise.resolve(null);
const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent),isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64uToBytes(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0));}
async function pushState(){
  const reg=await swReady;if(!reg||!('PushManager' in window))return {supported:false,reg};
  return {supported:true,reg,sub:await reg.pushManager.getSubscription(),perm:Notification.permission};
}
async function renderPush(){
  const box=$('#pushBox');if(!box)return;
  const st=await pushState(),pr=prof();
  if(!st.supported){box.innerHTML=isIos&&!isStandalone?`<p class="hint" style="margin:0">On iPhone, notifications work once the app is on your Home Screen: open this page in Safari, tap Share, then <b>Add to Home Screen</b>, and open Parcours from there.</p>`:'<p class="hint" style="margin:0">This browser does not support notifications.</p>';return;}
  const on=!!st.sub&&st.perm==='granted';
  box.innerHTML=`<div class="row" style="margin-bottom:12px"><span class="chip" style="--accent:var(${on?'--ok':'--ring'})">${on?'On for this device':st.perm==='denied'?'Blocked in browser settings':'Off for this device'}</span></div>
    <div class="g2"><div><label class="lab" for="puT">Alert me about new offers scoring at least</label><select id="puT">${[70,75,80,85,90].map(v=>`<option value="${v}" ${(pr.pushThreshold||80)===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div><label class="lab" for="puD">Weekly digest</label><select id="puD"><option value="1" ${pr.pushDigest!==false?'selected':''}>Monday morning summary</option><option value="0" ${pr.pushDigest===false?'selected':''}>Off</option></select></div></div>
    <div class="row" style="margin-top:12px">${on?`<button class="btn" id="puTest">Send a test</button><button class="btn ghost" id="puOff">Turn off</button>`:`<button class="btn primary" id="puOn" ${st.perm==='denied'?'disabled':''}>Turn on notifications</button>`}<span class="hint" id="puMsg" style="margin:0"></span></div>
    <p class="hint" style="margin:10px 0 0">The collectors check after each run (every 6 hours). ${isIos&&!isStandalone?'On iPhone, add the app to your Home Screen first.':''}</p>`;
  const msg=$('#puMsg');
  const saveSub=async sub=>api('/api/push',{method:'POST',body:JSON.stringify({action:'subscribe',subscription:sub.toJSON(),threshold:+$('#puT').value,digest:$('#puD').value==='1',device:navigator.userAgent.slice(0,80)})});
  const change=async()=>{setProfile({pushThreshold:+$('#puT').value,pushDigest:$('#puD').value==='1'});const s=(await pushState()).sub;if(s)try{await saveSub(s);}catch(e){}};
  $('#puT').addEventListener('change',change);$('#puD').addEventListener('change',change);
  const onB=$('#puOn');if(onB)onB.addEventListener('click',async()=>{
    onB.disabled=true;msg.textContent='Asking for permission…';
    try{const info=await api('/api/push');const perm=await Notification.requestPermission();if(perm!=='granted'){msg.textContent='Permission was not granted.';onB.disabled=false;return;}
      const sub=await st.reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(info.publicKey)});
      await saveSub(sub);setProfile({pushThreshold:+$('#puT').value,pushDigest:$('#puD').value==='1'});renderPush();}
    catch(e){msg.textContent=errText(e,{http_501:'Notifications are not configured on the server.'},'Could not turn on notifications.');onB.disabled=false;}});
  const tB=$('#puTest');if(tB)tB.addEventListener('click',async()=>{msg.textContent='Sending…';try{await api('/api/push',{method:'POST',body:JSON.stringify({action:'test',subscription:st.sub.toJSON()})});msg.textContent='Sent. It should appear in a few seconds.';}catch(e){msg.textContent=errText(e,{},'Test failed.');}});
  const oB=$('#puOff');if(oB)oB.addEventListener('click',async()=>{try{await api('/api/push',{method:'POST',body:JSON.stringify({action:'unsubscribe',subscription:st.sub.toJSON()})});}catch(e){}await st.sub.unsubscribe();renderPush();});
}

async function weekPanel(){
  const box=$('#weekBox');if(!box)return;
  if(caps.online&&!demo)await ensureCollected(null);
  if(!$('#weekBox'))return;
  const now=Date.now(),wk=now-7*864e5,today0=tms(today());
  const offers=colData&&!demo?visibleOffers():[];
  const strong=offers.filter(x=>(x.foundAt||0)>=wk&&x.m&&x.m.score>=75).sort((a,b)=>b.m.rank-a.m.rank);
  const dl=[];
  offers.forEach(x=>{if(x.deadline)dl.push({t:x.title,org:x.org,d:x.deadline,url:x.url,src:'Collected'});});
  state.saved.forEach(j=>{if(j.deadline)dl.push({t:j.title,org:j.company,d:j.deadline,url:j.url,src:'Saved'});});
  ((radar&&radar.items)||[]).forEach(x=>{if(x.deadline)dl.push({t:x.title,org:x.org,d:x.deadline,url:x.url,src:'Radar'});});
  const soon=dl.filter(x=>{const t=tms(x.d);return t>=today0&&t<=today0+14*864e5;}).sort((a,b)=>a.d.localeCompare(b.d));
  const follow=state.apps.filter(a=>a.stage==='applied'&&a.result==='open'&&daysAgo(a.date)>=14).sort((a,b)=>tms(a.date)-tms(b.date));

      <div class="stat"><span>Deadlines</span><b>${soon.length}</b><small>Next 14 days</small></div>
      <div class="stat"><span>Follow-ups due</span><b>${follow.length}</b><small>No reply after 14 days</small></div>
      <div class="stat"><span>Applications this week</span><b>${logged}</b><small>Logged in the last 7 days</small></div></div>
    <div class="two${strong.length?'':' one'}">
      ${strong.length?'<div class="panel"><h2>New strong matches</h2><div class="offers compact">'+strong.slice(0,5).map(x=>`<article class="offer">${scoreBadge(x.m)}<div class="ob"><h3>${link(x.url,x.title)}</h3><div class="meta"><b>${coLink(x.org)}</b> · ${esc(x.source)}</div></div></article>`).join('')+'</div>'+(strong.length>5?`<p style="margin:8px 0 0"><a href="#/opps/all">All ${strong.length}</a></p>`:'')+'</div>':''}
      <div class="panel"><h2>Coming up</h2>
        ${soon.length?soon.slice(0,6).map(x=>{const n=Math.round((tms(x.d)-today0)/864e5);return `<div class="rn"><b>${link(x.url,x.t)}</b><span>${esc(x.org||'')} · ${n===0?'today':n===1?'tomorrow':'in '+n+' days'} (${esc(x.d)}) · ${x.src}</span></div>`;}).join(''):'<p class="hint">No deadlines in the next two weeks.</p>'}
        <h2 style="margin-top:14px">Follow up</h2>

// Poli stores some text double-encoded ("Â£28,000", "â€“"): decode it back when that is what happened.
const CP1252={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};
const pfix=s=>{s=String(s==null?'':s);if(!/[ÂÃâ]/.test(s))return s;const b=[];
  for(const ch of s){const c=ch.charCodeAt(0);if(c<256)b.push(c);else if(CP1252[ch])b.push(CP1252[ch]);else return s;}
  try{return new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(b));}catch(e){return s;}};
async function poliJobsLoad(reset,before=[],pages=3){

    const res=await poliApi([...before,...Array.from({length:pages},(_,i)=>({action:act,initialFetch:reset&&i===0}))]);
    const seen=new Set(pj.jobs.map(j=>j.id));

function renderAcademia(){
  const box=$('#acBox'),d=acData;if(!box||!d)return;
  if(!d.at){box.innerHTML='<p class="hint">Nothing collected yet. Run the workflow "Refresh schools and professors" in GitHub Actions (it also runs every Sunday).</p>';return;}
  const words=acF.q.toLowerCase().split(/\s+/).filter(Boolean),has=t=>{t=t.toLowerCase();return words.every(w=>t.includes(w));};
  let rows,html;
  if(acF.tab==='professors'){
    const off=acOffers();
    const key={score:p=>p.score,papers:p=>p.papers,h:p=>p.h||0,theses:p=>(p.theses&&p.theses.count)||0}[acF.sort]||(p=>p.score);
    rows=(d.people||[]).filter(p=>(!acF.c||p.c===acF.c)&&has(`${p.name} ${p.instName} ${(p.topics||[]).join(' ')} ${(p.fields||[]).join(' ')}`)
      &&(acF.kind!=='phd'||p.last>=3||(p.theses&&p.theses.count))&&(acF.kind!=='email'||(p.emails||[]).length)&&(acF.kind!=='master'||((off.get(p.ror)||{}).programs||[]).length))
      .sort((a,b)=>key(b)-key(a));
    html=rows.slice(0,acMax).map(acCompactRow).join('');
  }else{
    const off=acOffers(),pc={};(d.people||[]).forEach(p=>{pc[p.ror]=(pc[p.ror]||0)+1;});
    const key={topic:s=>s.topic*1e6+s.cs,cs:s=>s.cs}[acF.sort];
    rows=(d.schools||[]).filter(s=>(!acF.c||s.c===acF.c)&&has(`${s.name} ${(s.aliases||[]).join(' ')} ${s.acronym} ${s.city}`)
      &&(acF.offer!=='research'||s.topic)&&(acF.offer!=='program'||((off.get(s.id)||{}).programs||[]).length)&&(acF.offer!=='scholarship'||((off.get(s.id)||{}).scholarships||[]).length)&&(acF.offer!=='people'||pc[s.id]))
      .sort((a,b)=>key?key(b)-key(a)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));
    html=rows.slice(0,acMax).map(acSchoolRow).join('');
  }
  box.innerHTML=rows.length?`<p class="hint">${rows.length.toLocaleString('en')} ${acF.tab}${rows.length>acMax?`, showing ${acMax}`:''}. Updated ${esc(rel(new Date(d.at).toISOString().slice(0,10)))}.${acF.tab==='professors'?' The score adds topic fit, supervision (last-author papers, theses directed), recent activity and impact. Select a professor for emails, links and papers.':' Select a school for its professors, master\'s and scholarships.'}</p>
    <div class="offers">${html}</div>${rows.length>acMax?`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" type="button" id="acMore">Show more</button></div>`:''}`
    :'<p class="hint">Nothing matches.</p>';
  const m=$('#acMore');if(m)m.addEventListener('click',()=>{acMax+=40;renderAcademia();});
}

const SECTION_LABEL={overview:'Home',discover:'Discover',track:'Track',notes:'Notes',profile:'Profile'};
const SECTION_OF=(t,seg)=>['opps','sponsors','academia'].includes(t)?'discover':['apps','queue','companies','company'].includes(t)?'track':['notes','profile'].includes(t)?t:'overview';
const SUBTABS={
  discover:[['#/opps','Jobs',(t,s)=>t==='opps'&&!['masters','labs','radar'].includes(s[1])],['#/opps/masters',"Master's & scholarships",(t,s)=>t==='opps'&&s[1]==='masters'],

// Detail drawer: a side panel on wide screens, a full-screen sheet on phones.
function openDrawer(html,label){
  let d=$('#drawer');
  if(!d){d=document.createElement('aside');d.id='drawer';d.className='drawer';d.setAttribute('role','dialog');d.setAttribute('aria-modal','false');document.body.appendChild(d);
    const sc=document.createElement('div');sc.id='drawerScrim';sc.className='drawer-scrim';sc.addEventListener('click',closeDrawer);document.body.appendChild(sc);}
  d.setAttribute('aria-label',label||'Details');
  d.innerHTML=`<div class="drawer-top"><b>${esc(label||'Details')}</b><button class="iconbtn" type="button" id="drawerX" aria-label="Close">✕</button></div><div class="drawer-body">${html}</div>`;
  $('#drawerX').addEventListener('click',closeDrawer);
  document.body.classList.add('has-drawer');d.scrollTop=0;
}
function closeDrawer(){document.body.classList.remove('has-drawer');const d=$('#drawer');if(d)d.innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('has-drawer'))closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('rowbtn')){e.preventDefault();e.target.click();}});
// A loading message never stays forever: after 15 s it turns into an error with a retry.
let loadWatch=0;
function watchLoading(){clearTimeout(loadWatch);loadWatch=setTimeout(()=>{document.querySelectorAll('#view .hint').forEach(h=>{if(/^Loading/.test(h.textContent.trim())){
  h.innerHTML='This did not load. <button class="linkbtn" type="button" data-act="retry">Try again</button>';}});},15000);}
document.addEventListener('click',e=>{const r=e.target.closest&&e.target.closest('[data-act="retry"]');if(r){colData=null;route();}});
function route(){
  const h=location.hash.replace(/^#\/?/,'');const [path,qs]=h.split('?');const seg=path.split('/').filter(Boolean);
  const t=seg[0]||'overview';
  const tab=t==='company'?'companies':t;
  document.body.dataset.page=tab;
  // Five sections; Discover and Track have tabs of their own.
  const sec=SECTION_OF(t,seg);
  document.querySelectorAll('#tabs a,.bottombar [data-t]').forEach(a=>{if(a.dataset.t===sec)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const ts=$('#topSec');if(ts)ts.textContent=SECTION_LABEL[sec]||'Home';
  const tabs=SUBTABS[sec],cur=tabs?tabs.find(x=>x[2](t,seg)):null,sn=$('#subnav');
  if(sn){sn.innerHTML=tabs?tabs.map(([h,l,on])=>`<a href="${h}" ${on(t,seg)?'aria-current="page"':''}>${l}</a>`).join(''):'';sn.hidden=!tabs;}
  closeDrawer();
  $('#demoBar').innerHTML=demo?`<div class="demo"><span>Previewing sample data. Nothing here is saved.</span><button class="btn sm" data-act="exitdemo">Exit preview</button></div>`:'';
  if(t==='apps')apps(qs);
  else if(t==='opps')opps(seg.slice(1));
  else if(t==='notes')notesPage();
  else if(t==='queue')queuePage();
  else if(t==='profile')profilePage();
  else if(t==='companies')companiesPage();
  else if(t==='sponsors')sponsorsPage(seg[1]);
  else if(t==='academia')academiaPage(seg[1]);
  else if(t==='company')companyPage(seg[1],qs);
  else if(t==='explore'){location.replace('#/');return;}
  else overview();
  window.scrollTo(0,0);watchLoading();
}

async function boot(){
  let p=null;
  try{p=await api('/api/ping');}
  catch(e){
    if(e.code==='unauthorized')return;
    caps.online=false;
    if(e.code==='http_503')notice(e.message);
    setSync('local');if(!demo)route();return;
  }
  caps={sources:p.sources||{},sync:!!p.sync,ai:!!p.ai,gmail:!!p.gmail,online:true};
  sample=caps.ai?makeSample():null;
  fetch('/radar.json').then(r=>r.ok?r.json():null).then(j=>{if(j){radar=j;renderRadar();}}).catch(()=>{});
  if(!demo)route();
  if(caps.sync)await pull();else setSync('local');
}
