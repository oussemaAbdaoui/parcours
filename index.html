<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECF0EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#10201C; --muted:#5C6E69; --line:#D6DFDB; --line-2:#E6ECE9;
  --job:#0F766E; --master:#4F46E5; --phd:#BE185D;
  --job-t:#DCF1EE; --master-t:#E6E5FB; --phd-t:#F9E1EC;
  --ok:#1A7F4E; --warn:#A86A06; --bad:#B8433B;
  --hi:#1A7F4E; --hi-t:#DDF2E6; --mid:#A86A06; --mid-t:#F7EBD3; --lo:#B8433B; --lo-t:#F7E1DE;
  --accent:var(--job); --tint:var(--job-t);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1311; --surface:#131E1B; --surface-2:#18251F; --ink:#E3ECE8; --muted:#93A59F; --line:#26352F; --line-2:#1E2B27;
    --job:#3DC2B3; --master:#8F8CF5; --phd:#F07AAE;
    --job-t:#11322D; --master-t:#1F1F45; --phd-t:#3B1728;
    --ok:#5FD08F; --warn:#E6AE4C; --bad:#F08A80;
    --hi:#5FD08F; --hi-t:#123324; --mid:#E6AE4C; --mid-t:#35280F; --lo:#F08A80; --lo-t:#3A1A17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1311; --surface:#131E1B; --surface-2:#18251F; --ink:#E3ECE8; --muted:#93A59F; --line:#26352F; --line-2:#1E2B27;
  --job:#3DC2B3; --master:#8F8CF5; --phd:#F07AAE;
  --job-t:#11322D; --master-t:#1F1F45; --phd-t:#3B1728;
  --ok:#5FD08F; --warn:#E6AE4C; --bad:#F08A80;
  --hi:#5FD08F; --hi-t:#123324; --mid:#E6AE4C; --mid-t:#35280F; --lo:#F08A80; --lo-t:#3A1A17;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell: route-line sidebar */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--surface-2) 235px,var(--line) 235px,var(--line) 236px,transparent 236px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding:26px 20px 22px 24px;background:transparent}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em}
.brand svg{flex:none}
.tabs{position:relative;display:flex;flex-direction:column;gap:2px;padding-left:4px}
.tabs::before{content:"";position:absolute;left:11px;top:16px;bottom:16px;width:2px;background:var(--line);border-radius:2px}
.tabs a{position:relative;display:flex;align-items:center;gap:14px;text-decoration:none;padding:8px 10px 8px 0;border-radius:10px;color:var(--muted);font-weight:500;font-size:15.5px}
.tabs a::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);position:relative;z-index:1;transition:border-color .15s,background .15s}
.tabs a:hover{color:var(--ink)}
.tabs a:hover::before{border-color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:650}
.tabs a[aria-current="page"]::before{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 4px var(--surface-2),0 0 0 5px var(--line)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.syncl{font-size:13px;color:var(--muted)}
.syncl:not(:empty)::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px}
.syncl.on::before{background:var(--ok)}.syncl.err::before{background:var(--bad)}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.theme:hover{color:var(--ink);border-color:var(--ink)}
.wrap{max-width:1080px;width:100%;margin:0 auto;padding-inline:36px;padding-block:34px 72px}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;background:none}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);overflow-x:auto}
  .brand{font-size:19px}.brand span{display:none}
  .tabs{flex-direction:row;gap:2px;padding:0}
  .tabs::before{display:none}
  .tabs a{padding:6px 12px;border-radius:999px;font-size:14.5px;white-space:nowrap}
  .tabs a::before{display:none}
  .tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .syncl{display:none}
  .wrap{padding-inline:16px;padding-block:22px 56px}
}

/* type */
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,42px);line-height:1.05;margin:0 0 8px;letter-spacing:-.025em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{text-wrap:balance}
.sub{color:var(--muted);margin:0 0 28px;max-width:62ch;font-size:16.5px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.lab{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;letter-spacing:.02em;color:var(--muted)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:14.5px;font-weight:550;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=date],input[type=url],input[type=number],input[type=password],textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:15px;width:100%}
select:hover,input:hover,textarea:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
textarea{line-height:1.5;resize:vertical}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.toolbar select{width:auto;padding:6px 10px;font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.filters select{width:auto}
.sc{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;background:var(--surface);cursor:pointer}
.sc.off{opacity:.45;cursor:not-allowed}
.srcs{display:flex;gap:8px;flex-wrap:wrap}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.panel>h2+.hint{margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.two .panel{margin-bottom:0}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.demo{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--tint);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px;--accent:var(--master);--tint:var(--master-t)}
.demo.warn{--accent:var(--warn);--tint:var(--mid-t)}
.nudge{background:var(--mid-t);color:var(--ink);border-radius:10px;padding:9px 13px;font-size:14px;margin:0 0 12px}
.nudge a{font-weight:600}
.empty{text-align:center;padding:40px 20px}
.empty p{color:var(--muted);max-width:46ch;margin:6px auto 18px}
.empty .row{justify-content:center}

/* stats and charts */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat b{display:block;font-family:var(--mono);font-weight:600;font-size:28px;line-height:1.15;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat small{display:block;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chart{overflow-x:auto}
.chart svg{display:block;min-width:600px;width:100%;height:auto}
svg .t{fill:var(--muted);font-size:12px;font-family:var(--body)}
svg .tb{fill:var(--ink);font-size:13px;font-weight:600;font-family:var(--body)}
svg .grid{stroke:var(--line-2);stroke-width:1}
svg .today{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
svg .dot{cursor:pointer}
svg .dot:hover{stroke:var(--ink);stroke-width:2}
.frow{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.frow .tr{height:12px;background:var(--line-2);border-radius:99px;overflow:hidden;position:relative}
.frow .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.frow .tr i.b{background:var(--ink);opacity:.85}
.frow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.frow .v b{color:var(--ink)}
.frow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{display:grid;grid-template-columns:130px repeat(3,1fr);gap:0;min-width:520px}
.mxw{overflow-x:auto}
.mx>*{padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:1px solid var(--line-2)}
.mx .h{border-top:0;font-size:13px;font-weight:600;color:var(--muted)}
.mx .cn{align-items:flex-start;flex-direction:row;gap:8px;font-family:var(--display);font-weight:500;font-size:16px;justify-content:flex-start}
.mx a{text-decoration:none;border-radius:10px}
.mx a:hover{background:var(--surface-2)}
.mx .c{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:600;font-size:14px}
.mx .z{color:var(--line);font-size:22px;line-height:1}
.mx small{font-size:12px;color:var(--muted)}
.insight{white-space:pre-wrap;font-size:15px;margin-top:12px;max-width:68ch}

/* offers with match score */
.offers{display:flex;flex-direction:column}
.offer{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 16px;align-items:start;padding:14px 0;border-top:1px solid var(--line-2)}
.offer:first-child{border-top:0;padding-top:4px}
.offer:not(:has(.score)){grid-template-columns:minmax(0,1fr) auto}
.offer h3{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.offer h3 a{text-decoration:none;background-image:linear-gradient(var(--line),var(--line));background-size:100% 1px;background-position:0 100%;background-repeat:no-repeat}
.offer h3 a:hover{background-image:linear-gradient(var(--ink),var(--ink))}
.offer .meta{font-size:13.5px;color:var(--muted);margin-top:3px}
.offer .meta b{color:var(--ink);font-weight:600}
.oa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.offers.compact .offer{grid-template-columns:52px minmax(0,1fr)}
@media(max-width:640px){.offer{grid-template-columns:46px minmax(0,1fr)}.oa{grid-column:2;justify-content:flex-start;margin-top:6px}}
.score{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;font-family:var(--mono);font-weight:700;font-size:18px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;position:relative}
.score::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1.5px solid currentColor;opacity:.35}
.score.s-hi{background:var(--hi-t);color:var(--hi)}
.score.s-mid{background:var(--mid-t);color:var(--mid)}
.score.s-lo{background:var(--lo-t);color:var(--lo)}
@media(max-width:640px){.score{width:42px;height:42px;font-size:16px}}
.urgent{display:inline-block;background:var(--lo-t);color:var(--lo);border-radius:999px;padding:0 8px;font-size:12px;font-weight:650;vertical-align:1px}
.new{display:inline-block;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:650;vertical-align:1px;letter-spacing:.02em}
details.why,details.desc{margin-top:6px}
details.why summary,details.desc summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:5px}
details.why summary::-webkit-details-marker,details.desc summary::-webkit-details-marker{display:none}
details.why summary::before,details.desc summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open].why summary::before,details[open].desc summary::before{transform:rotate(90deg)}
details.why summary:hover,details.desc summary:hover{color:var(--ink)}
.bars{display:grid;gap:6px;margin-top:8px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px}
.bar{display:grid;grid-template-columns:128px 90px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.bar span{font-weight:600}
.bar span small{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:11px}
.bar i{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar em{font-style:normal;color:var(--muted);overflow-wrap:anywhere}
.bar.unk{opacity:.55}
@media(max-width:560px){.bar{grid-template-columns:1fr 70px}.bar em{grid-column:1 / -1}}
.an{font-size:14px;color:var(--muted);margin:6px 0 0;white-space:pre-wrap}

/* job rows (radar, searches) */
.job,.rad{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;border-top:1px solid var(--line-2);padding:12px 0}
.job:first-child,.rad:first-child{border-top:0}
.job h3,.rad h3{margin:0;font-size:16px;font-weight:600}
.job h3 a,.rad h3 a{text-decoration:none;border-bottom:1px solid var(--line)}
.job h3 a:hover,.rad h3 a:hover{border-color:var(--ink)}
.job .meta,.rad .meta{font-size:13.5px;color:var(--muted)}
.rad p{grid-column:1;margin:0;font-size:14px;color:var(--muted)}
.ssh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px;font-weight:600;font-size:15px}
.ssh:first-child{margin-top:0}
.fchips{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:14px}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.conf{font-size:12px;font-weight:600;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted)}
.conf.ok{color:var(--ok);border-color:var(--ok)}
.src{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;color:var(--muted);margin-left:4px}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--tint);color:var(--accent);font-weight:650;letter-spacing:.01em}

/* profile */
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--muted)}
.skill:hover{border-color:var(--ink);color:var(--ink)}
.skill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.order{list-style:none;margin:0;padding:0;counter-reset:o;display:flex;flex-direction:column;gap:6px}
.order li{counter-increment:o;display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2)}
.order li::before{content:counter(o);font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.order .btn.sm{padding:2px 9px}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px 22px}
.fam .lab{margin-bottom:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}}
.found{margin-top:12px;font-size:14px;color:var(--ink);background:var(--hi-t);border-radius:10px;padding:0 14px;line-height:1.55}
.found:not(:empty){padding:10px 14px}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:14px;min-width:220px;flex:1 1 220px}

/* applications */
.app{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px 13px 18px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;position:relative;overflow:hidden}
.app::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.app h3{margin:0;font-size:16.5px;font-weight:600}
.app h3 small{font-weight:400;color:var(--muted);font-size:14.5px}
.app .meta{font-size:13.5px;color:var(--muted)}
.app .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1 / -1}
.app .ctl select{width:auto;padding:4px 8px;font-size:13.5px}
.app .an{grid-column:1 / -1}
.imp{border:1px dashed var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px;background:var(--surface)}
.imp textarea{min-height:130px;margin:8px 0}
.cand{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px}
.cand b{font-size:15px}
.err{color:var(--bad);font-size:14px;margin:6px 0 0}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 24px 60px rgba(8,20,16,.25)}
dialog::backdrop{background:rgba(8,16,14,.55);backdrop-filter:blur(2px)}
.dl{padding:22px;display:grid;gap:12px}
.dl h2{margin:0;font-size:22px}
.dl label{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;color:var(--muted)}
.dl textarea{min-height:70px}
.dl .acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

/* explore */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14.5px;color:var(--muted);margin-bottom:16px}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .big{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.015em}
.card .flag{font-size:30px;line-height:1}
.card .meta{font-size:13.5px;color:var(--muted)}
.meter{height:5px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.card.dom{border-top:4px solid var(--accent)}
.card.dom .big{color:var(--accent)}
.card.dom p{margin:0;font-size:14px;color:var(--muted)}
.angle{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}
@media(max-width:640px){.angle{grid-template-columns:1fr}}
.angle div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px}
.angle strong{display:block;font-size:12.5px;margin-bottom:2px;letter-spacing:.03em;text-transform:uppercase}
.angle .e strong{color:var(--ok)}.angle .g strong{color:var(--warn)}
.tip{font-size:15px;color:var(--muted);margin:0 0 20px;padding-left:12px;border-left:3px solid var(--accent)}
.plist{display:grid;gap:10px}
.plat{display:grid;grid-template-columns:1fr auto;gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;align-items:center}
.plat h3{margin:0;font-size:16.5px;font-weight:600}
.plat h3 a{text-decoration:none;border-bottom:1px solid var(--line)}
.plat h3 a:hover{border-color:var(--accent)}
.kind{font-size:12.5px;color:var(--muted);margin-left:8px;font-weight:400}
.plat p{grid-column:1;margin:0;font-size:14px;color:var(--muted)}
.plat .log{font-size:13px;color:var(--muted)}
.prio{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.prio i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.prio i.on{background:var(--accent)}
.status{grid-column:2;grid-row:1 / span 3;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13.5px;min-width:104px;text-align:center}
.status[data-s="exploring"]{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.status[data-s="applied"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.status[data-s="skip"]{text-decoration:line-through;color:var(--muted)}
.plat.skipped{opacity:.55}
.notes textarea{min-height:100px}

/* notes */
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:grid;gap:8px}
.note .top2{display:flex;gap:8px;flex-wrap:wrap}
.note input[type=text]{font-weight:600;flex:1;min-width:160px}
.note select{width:auto}
.note textarea{min-height:110px}
.note small{color:var(--muted);font-size:12.5px}
.rn{display:block;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;font-size:14px}
.rn:hover{border-color:var(--ink)}
.rn b{display:block;font-size:15px}
.rn span{color:var(--muted);white-space:pre-wrap}

.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot button{border:0;background:none;text-decoration:underline;color:var(--muted);padding:0;font-size:13px}
.foot button:hover{color:var(--ink)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DAY=864e5;
const tms=d=>new Date(d+'T00:00:00').getTime();
const iso=ms=>{const x=new Date(ms);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const today=()=>iso(Date.now());
const daysAgo=d=>Math.floor((Date.now()-tms(d))/DAY);
const rel=d=>{const n=daysAgo(d);return n===0?'today':n===1?'yesterday':n>1?n+' days ago':d;};

const emptyState=()=>({apps:[],status:{},notes:{},journal:[],saved:[],searches:[],seen:{},seenAt:0,feeds:[],mailSeen:[],oppsHidden:[],oppsSeenAt:0,profile:null,updatedAt:0});

/* state + persistence */
const LKEY='parcours-v1', PWKEY='parcours-pw';
let state=emptyState(), real=null, demo=false, sample=null, downloads=null;
let caps={sources:{},sync:false,ai:false,gmail:false,online:false};
let timer=null, saving=false, dirty=false;

const hasData=s=>s.apps.length||s.journal.length||Object.keys(s.status).length||Object.keys(s.notes).length;
const getPw=()=>{try{return localStorage.getItem(PWKEY)||'';}catch(e){return '';}};
function setSync(m){const el=$('#sync');if(!el)return;el.className='syncl'+(m==='saved'?' on':m==='error'?' err':'');el.textContent={saving:'Saving…',saved:'Synced',local:'Saved on this device only',error:'Sync failed, saved on this device'}[m]||'';}
function persistLocal(){try{localStorage.setItem(LKEY,JSON.stringify(state));}catch(e){}}
async function api(path,opts={}){
  let r;
  try{r=await fetch(path,Object.assign({},opts,{headers:Object.assign({'content-type':'application/json','x-app-password':getPw()},opts.headers||{})}));}
  catch(e){throw {code:'network',message:'Could not reach the server.'};}
  let j=null;try{j=await r.json();}catch(e){}
  if(r.status===401){showLogin();throw {code:'unauthorized',message:'Sign in to continue.'};}
  if(!r.ok)throw {code:'http_'+r.status,message:(j&&j.error)||('Request failed ('+r.status+')')};
  return j;
}
function save(){
  if(demo)return;
  state.updatedAt=Date.now();persistLocal();
  if(!caps.sync){setSync('local');return;}
  dirty=true;clearTimeout(timer);timer=setTimeout(flush,800);setSync('saving');
}
async function flush(){
  if(saving){timer=setTimeout(flush,300);return;}
  if(!dirty||!caps.sync)return;
  saving=true;dirty=false;
  try{await api('/api/state',{method:'PUT',body:JSON.stringify({state:clone(state)})});setSync('saved');}catch(e){setSync('error');}
  saving=false;if(dirty)flush();
}
async function pull(){
  try{
    const r=await api('/api/state');
    if(r&&r.state){
      const remote=r.state;
      if((remote.updatedAt||0)>(state.updatedAt||0)&&!demo){state=Object.assign(emptyState(),remote);persistLocal();setSync('saved');route();}
      else if((state.updatedAt||0)>(remote.updatedAt||0)){dirty=true;flush();}
      else setSync('saved');
    }else if(hasData(state)){dirty=true;flush();}
    else setSync('saved');
  }catch(e){setSync('error');}
}
function parseJsonLoose(t){
  const tryP=x=>{try{return {v:JSON.parse(x)};}catch(e){return null;}};
  let r=tryP(t.trim());if(r)return r.v;
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){r=tryP(f[1].trim());if(r)return r.v;}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(a>=0&&b>a){r=tryP(t.slice(a,b+1));if(r)return r.v;}
  throw {code:'invalid_json',message:'Could not read the answer.',text:t};
}
function makeSample(){
  const f=async(prompt,opts={})=>{
    const j=await api('/api/ai',{method:'POST',body:JSON.stringify({prompt,tier:opts.modelTier})});
    if(opts.onText)opts.onText({text:j.text,delta:j.text});
    return {text:j.text};
  };
  f.json=async(prompt,opts)=>parseJsonLoose((await f(prompt,opts)).text);
  return f;
}
function errText(e,map,def){
  if(e&&e.code&&map[e.code])return map[e.code];
  if(e&&e.message&&(String(e.code).startsWith('http')||e.code==='network'||e.code==='unauthorized'))return e.message;
  return def;
}
downloads={save:async({filename,data})=>{
  const type=/\.json$/i.test(filename)?'application/json':'text/csv';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}};

function metrics(apps){
  const n=apps.length;
  const replied=apps.filter(a=>a.stage!=='applied'||a.result==='rejected').length;
  const inter=apps.filter(a=>a.stage==='interview'||a.stage==='offer').length;
  const offers=apps.filter(a=>a.stage==='offer').length;
  const waiting=apps.filter(a=>a.stage==='applied'&&a.result==='open'&&daysAgo(a.date)>21).length;
  return {n,replied,inter,offers,waiting};
}
const gotReply=a=>a.stage!=='applied'||a.result==='rejected';

function timelineSvg(apps){
  const rows=COUNTRIES.filter(c=>apps.some(a=>a.c===c.id));
  const W=760,L=112,R=22,T=14,RH=48,B=30,H=T+rows.length*RH+B;
  const now=Date.now();
  let min=Math.min(...apps.map(a=>tms(a.date)),now-56*DAY)-3*DAY;
  const max=now+4*DAY;
  const x=ms=>L+(ms-min)/(max-min)*(W-L-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of applications by country">`;
  rows.forEach((c,i)=>{const y=T+i*RH+RH/2;
    s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="tb" x="0" y="${y+4}">${c.flag} ${esc(c.name.length>11?c.name.slice(0,10)+'…':c.name)}</text>`;});
  const d0=new Date(min);let cur=new Date(d0.getFullYear(),d0.getMonth()+1,1);
  while(cur.getTime()<max){const px=x(cur.getTime());
    s+=`<line class="grid" x1="${px}" x2="${px}" y1="${T}" y2="${H-B}"/><text class="t" x="${px+4}" y="${H-10}">${cur.toLocaleDateString('en',{month:'short'})}</text>`;
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  s+=`<line class="today" x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H-B}"/><text class="t" x="${x(now)-14}" y="${H-10}">Today</text>`;
  const seen={};const rad={applied:5,replied:6.5,interview:8,offer:10};
  [...apps].sort((a,b)=>tms(a.date)-tms(b.date)).forEach(a=>{
    const ri=rows.findIndex(c=>c.id===a.c);if(ri<0)return;
    const key=a.c+'|'+a.date;const k=seen[key]=(seen[key]||0)+1;const j=k-1;
    const cx=x(tms(a.date))+Math.floor(j/3)*10, cy=T+ri*RH+RH/2+((j%3)-1)*12;
    const col=`var(${(DOM[a.d]||DOM.job).color})`;
    const rej=a.result==='rejected';
    const fill=rej?'var(--surface)':col;
    const op=a.result==='withdrawn'?.35:1;
    const ring=a.result==='accepted'?'stroke:var(--ink);stroke-width:2.5':`stroke:${col};stroke-width:2`;
    s+=`<circle class="dot" data-id="${esc(a.id)}" cx="${cx.toFixed(1)}" cy="${cy}" r="${rad[a.stage]||5}" style="fill:${fill};${ring}" opacity="${op}" tabindex="0"><title>${esc(a.org)}${a.role?', '+esc(a.role):''} (${STAGE_LABEL[a.stage]}, ${RES_LABEL[a.result]}, ${a.date})</title></circle>`;
  });
  return s+'</svg>';
}
function funnel(m){
  const steps=[['Applied',m.n],['Got a reply',m.replied],['Interview',m.inter],['Offer',m.offers]];
  return steps.map(([l,v])=>`<div class="frow"><span class="nm">${l}</span><span class="tr"><i style="width:${m.n?Math.round(v/m.n*100):0}%"></i></span><span class="v"><b>${v}</b> ${pct(v,m.n)}</span></div>`).join('');
}
function platforms(apps){
  const map={};
  apps.forEach(a=>{const k=a.p||'Other / direct';(map[k]=map[k]||{n:0,r:0});map[k].n++;if(gotReply(a))map[k].r++;});
  const list=Object.entries(map).sort((a,b)=>b[1].n-a[1].n).slice(0,8);const mx=list[0][1].n;
  return list.map(([k,v])=>`<div class="frow"><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="tr"><i style="width:${Math.round(v.n/mx*100)}%;opacity:.35"></i><i class="b" style="width:${Math.round(v.r/mx*100)}%"></i></span><span class="v"><b>${v.n}</b> · ${pct(v.r,v.n)}</span></div>`).join('');
}
function matrix(apps){
  let h=`<div class="mxw"><div class="mx"><div class="h"></div>${Object.values(DOM).map(v=>`<div class="h">${v.label}</div>`).join('')}`;
  COUNTRIES.forEach(c=>{
    h+=`<div class="cn"><span aria-hidden="true">${c.flag}</span>${esc(c.name)}</div>`;
    Object.entries(DOM).forEach(([d,v])=>{
      const l=apps.filter(a=>a.c===c.id&&a.d===d);const r=l.filter(gotReply).length;
      if(!l.length){h+=`<div><span class="z" aria-label="none">·</span></div>`;return;}
      const sz=Math.round(26+Math.sqrt(l.length)*10);
      h+=`<a href="#/apps?fc=${c.id}&fd=${d}" style="--accent:var(${v.color})" aria-label="${c.name}, ${v.label}: ${l.length} applications"><span class="c" style="width:${sz}px;height:${sz}px">${l.length}</span><small>${r} replied</small></a>`;
    });
  });
  return h+'</div></div>';
}
async function analyse(){
  const out=$('#insOut'),btn=$('#insBtn');if(!sample)return;

  const byC={},byD={},byP={};
  state.apps.forEach(a=>{const cn=(cById(a.c)||{}).name||a.c;byC[cn]=(byC[cn]||0)+1;byD[a.d]=(byD[a.d]||0)+1;const p=a.p||'direct';byP[p]=byP[p]||{n:0,replied:0};byP[p].n++;if(gotReply(a))byP[p].replied++;});
  const data={today:today(),totals:m,byCountry:byC,byRoute:byD,byPlatform:byP,
    applications:state.apps.map(a=>({country:(cById(a.c)||{}).name,route:a.d,platform:a.p,daysAgo:daysAgo(a.date),stage:a.stage,result:a.result}))};
  const prompt=`You are helping a Tunisian software engineering graduate (ML/NLP and backend focus, English C1, French B2) review their job, master's and PhD search. Below is their application data as JSON. Write 3 to 5 short, specific observations about patterns (response rates by country, route or platform, stalled applications, balance between routes), then 2 concrete next actions for this week. Be direct and honest, plain text, no markdown, no headings. If there is too little data to conclude something, say so.\n\nDATA:\n${JSON.stringify(data)}`;
  btn.disabled=true;out.textContent='Thinking…';
  try{await sample(prompt,{onText:({text})=>{out.textContent=text;}});}
  catch(e){out.textContent=errText(e,{},'Analysis failed. Try again.');}

/* gmail scan */
let gmItems=[], gmIgnored=[], gmNote=null;
const normOrg=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function matchApp(org,role){
  const o=normOrg(org),r=normOrg(role);if(o.length<2)return null;
  const hits=state.apps.filter(a=>{const x=normOrg(a.org);return x&&(x===o||(Math.min(x.length,o.length)>=4&&(x.includes(o)||o.includes(x))));});
  const roleHit=a=>r&&normOrg(a.role)===r?1:0;
  return hits.sort((a,b)=>roleHit(b)-roleHit(a)||tms(b.date)-tms(a.date))[0]||null;
}
function gmPlan(x){
  const e={c:cById(x.c)?x.c:'fr',d:DOM[x.d]?x.d:'job',stage:STAGES.includes(x.stage)?x.stage:'applied',result:RES.includes(x.result)?x.result:'open'};
  if(x.kind==='opportunity')return Object.assign(e,{act:'save',text:state.saved.some(s=>s.id==='gm'+x.id)?'Already in saved jobs':'Save to saved jobs',on:!state.saved.some(s=>s.id==='gm'+x.id)});
  const a=matchApp(x.org,x.role);
  if(!a)return Object.assign(e,{act:'new',text:`Add as new application (${STAGE_LABEL[e.stage]}, ${RES_LABEL[e.result]})`,on:true});

async function searchJobs(q,sources){

  if(q.type)p.set('type',q.type);if(q.visa)p.set('visa','1');
  const call=(path,list)=>{const x=new URLSearchParams(p);x.set('sources',list.join(','));return api(path+'?'+x.toString());};
  const js=sources.filter(s=>!PY.includes(s)),py=sources.filter(s=>PY.includes(s));

    py.length?call('/api/boards',py).catch(e=>({jobs:[],sources:Object.fromEntries(py.map(s=>[s,{ok:false,error:e.message||'Failed'}]))})):null]);
  const merged=new Map();

      out+='\n';}
    return out;
  }
  return f.text();
}
function setProfile(patch){state.profile=Object.assign(prof(),patch);save();}
const listVal=v=>String(v||'').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
function profilePage(){

      <div class="g4" style="margin-top:12px">${LANG_NAMES.map(([k,l])=>`<div><label class="lab" for="pfL${k}">${l}</label><select id="pfL${k}" data-lang="${k}">${LEVELS.map(v=>`<option value="${v}" ${p.languages[k]===v?'selected':''}>${v||'None'}</option>`).join('')}</select></div>`).join('')}</div></div>
    <div class="panel"><h2>Where, in order</h2><p class="hint">Your first country scores highest. Tick where you need a visa or work permit.</p>
      <ol class="order" id="pfOrder">${p.countries.map((id,i)=>{const c=cById(id);return c?`<li><span>${c.flag} ${esc(c.name)}</span><label class="sc"><input type="checkbox" data-visa="${id}" ${p.visa[id]?'checked':''}> Visa</label><span class="row"><button class="btn sm" data-up="${i}" ${i?'':'disabled'} aria-label="Move ${esc(c.name)} up">↑</button><button class="btn sm" data-down="${i}" ${i<p.countries.length-1?'':'disabled'} aria-label="Move ${esc(c.name)} down">↓</button></span></li>`:'';}).join('')}</ol>

      +`${r.years!=null?`${r.years} years of experience (internships count half)`:'no dated experience found, set your years below'}, `

  $('#pfRoles').addEventListener('change',e=>setProfile({roles:listVal(e.target.value)}));
  $('#pfExcl').addEventListener('change',e=>setProfile({exclude:listVal(e.target.value)}));
  $('#pfYears').addEventListener('change',e=>setProfile({years:Math.max(0,+e.target.value||0)}));
  $('#pfDeg').addEventListener('change',e=>{const v=+e.target.value;setProfile({degree:Object.assign(prof().degree,{level:v,name:SC?SC.DEGREE_NAME[v]||'':''})});});
  $('#pfDegY').addEventListener('change',e=>setProfile({degree:Object.assign(prof().degree,{year:+e.target.value||null})}));
  $('#pfDegF').addEventListener('change',e=>setProfile({degree:Object.assign(prof().degree,{field:e.target.value.trim()})}));
  document.querySelectorAll('[data-lang]').forEach(s=>s.addEventListener('change',()=>setProfile({languages:Object.assign(prof().languages,{[s.dataset.lang]:s.value})})));
  $('#pfRemote').addEventListener('change',e=>setProfile({remote:e.target.value}));
  $('#pfOrder').addEventListener('change',e=>{const v=e.target.dataset.visa;if(v)setProfile({visa:Object.assign(prof().visa,{[v]:e.target.checked})});});
  $('#pfOrder').addEventListener('click',e=>{const u=e.target.closest('[data-up],[data-down]');if(!u)return;const l=prof().countries,i=+(u.dataset.up??u.dataset.down),j=u.dataset.up!=null?i-1:i+1;
    [l[i],l[j]]=[l[j],l[i]];setProfile({countries:l});profilePage();});
}

/* ---------- Router ---------- */
function route(){
  const h=location.hash.replace(/^#\/?/,'');const [path,qs]=h.split('?');const seg=path.split('/').filter(Boolean);
  const t=seg[0]||'overview';
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.t===t)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  $('#demoBar').innerHTML=demo?`<div class="demo"><span>Previewing sample data. Nothing here is saved.</span><button class="btn sm" data-act="exitdemo">Exit preview</button></div>`:'';
  if(t==='apps')apps(qs);
  else if(t==='opps')opps();
  else if(t==='notes')notesPage();
  else if(t==='profile')profilePage();
  else if(t==='explore'){const c=cById(seg[1]);if(c&&DOM[seg[2]])exploreDomain(c,seg[2]);else if(c)exploreCountry(c);else exploreHome();}
  else overview();
  window.scrollTo(0,0);
}

    if(act==='new')openDlg({});
    else if(act==='import'){const b=$('#imp');if(b)b.hidden=!b.hidden;}
    else if(act==='gmail'){const b=$('#gm');if(b){b.hidden=!b.hidden;if(!b.hidden)gmStatus();}}

    return;}

  if(js){const j=jobReg[js.dataset.jsave];if(j&&!state.saved.some(x=>x.id===j.id)){state.saved.unshift({id:j.id,title:j.title,company:j.company,location:j.location,posted:j.posted,type:j.type,url:j.url,c:j.c,source:j.source});state.saved=state.saved.slice(0,60);save();js.disabled=true;js.textContent='Saved';renderSaved();}return;}
  const jl=e.target.closest('[data-jlog]');
  if(jl){const j=jobReg[jl.dataset.jlog];if(j)openDlg({org:j.company,role:j.title,c:j.c||'fr',d:'job',p:(SRC[j.source]||{}).label||'',link:safeUrl(j.url)});return;}
  const cs=e.target.closest('[data-cosave]');
  if(cs){const x=colData&&colData.items.find(i=>i.id===cs.dataset.cosave);if(x&&!state.saved.some(s=>s.id==='co'+x.id)){state.saved.unshift({id:'co'+x.id,title:x.title,company:x.org,location:x.location,posted:x.posted,type:x.type||'',url:x.url,c:x.c,source:x.source,kind:x.kind,deadline:x.deadline||'',desc:(x.desc||'').slice(0,1500),applicants:x.applicants,rating:x.company&&x.company.rating?x.company:null});state.saved=state.saved.slice(0,60);save();cs.disabled=true;renderSaved();}return;}
  const cl=e.target.closest('[data-colog]');
  if(cl){const x=colData&&colData.items.find(i=>i.id===cl.dataset.colog);if(x)openDlg({org:x.org||x.source,role:x.title,c:cById(x.c)?x.c:'fr',d:DOM[x.kind]?x.kind:'job',p:x.source,link:safeUrl(x.url)});return;}
  const ch=e.target.closest('[data-cohide]');
  if(ch){state.oppsHidden=[...(state.oppsHidden||[]),ch.dataset.cohide].slice(-2000);save();renderCollected();return;}
  const jd=e.target.closest('[data-jdel]');if(jd){state.saved=state.saved.filter(x=>x.id!==jd.dataset.jdel);save();renderSaved();return;}
  const sd=e.target.closest('[data-ssdel]');if(sd){state.searches=state.searches.filter(x=>x.id!==sd.dataset.ssdel);save();runSaved();return;}
  const fd=e.target.closest('[data-fdel]');if(fd){state.feeds=state.feeds.filter(x=>x.id!==fd.dataset.fdel);save();renderFeeds();return;}
  const rf=e.target.closest('[data-rf]');if(rf){radarFilter=rf.dataset.rf;renderRadar();return;}
  const rl=e.target.closest('[data-rlog]');
  if(rl){const x=((radar&&radar.items)||[]).find(i=>i.id===rl.dataset.rlog);if(x)openDlg({org:x.org,role:x.title,c:x.c,d:x.kind,p:'',link:safeUrl(x.url)});return;}

async function boot(){
  let p=null;
  try{p=await api('/api/ping');}
  catch(e){
    if(e.code==='unauthorized')return;
    caps.online=false;
    if(e.code==='http_503')notice(e.message);
    setSync('local');if(!demo)route();return;
  }
  caps={sources:p.sources||{},sync:!!p.sync,ai:!!p.ai,gmail:!!p.gmail,online:true};
  sample=caps.ai?makeSample():null;
  fetch('/radar.json').then(r=>r.ok?r.json():null).then(j=>{if(j){radar=j;renderRadar();}}).catch(()=>{});
  if(!demo)route();
  if(caps.sync)await pull();else setSync('local');
}

$('#bkFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||!Array.isArray(p.apps))throw 0;
    if(confirm('Replace your current data with this backup?')){state=Object.assign(emptyState(),p);save();route();}}
  catch(x){alert('That file is not a valid Parcours backup.');}
  e.target.value='';
});

$('#signout').addEventListener('click',()=>{try{localStorage.removeItem(PWKEY);}catch(e){}location.reload();});
route();
boot();
